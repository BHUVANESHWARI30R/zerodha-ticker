<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">

<!-- ✅ Socket.IO v4 (compatible with Flask-SocketIO 5+) -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.ticker-container {
    width: 100%;
    height: 240px;
    overflow: hidden;
    background: black;
}


/* each row */
.ticker-row {
    display: flex;
    height: 120px;
}

/* each stock = fixed 5 per row */
.stock {
    width: 20%;   /* 🔥 5 per row */
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    box-sizing: border-box;
}



/* scrolling whole block */
.ticker-track {
    display: flex;
    flex-direction: column;
    animation: scroll 60s linear infinite;
}


/* keep your existing stock styles unchanged */

@keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}




.symbol {
    font-size: 55px;
    font-weight: bold;
    white-space: nowrap;   /* ✅ PREVENT CUT */
}
.left-side {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.right-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
}

.arrow {
    margin-right: 2px;
}

.up { color: lime; }
.down { color: red; }
.left-side {
    display: flex;
    flex-direction: column;
}

.right-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}

.symbol {
    font-size: 55px;
    font-weight: bold;
}

.price {
    font-size: 50px;
}

.percent {
    font-size: 40px;
}

.change {
    font-size: 45px;
    display: flex;
    align-items: center;
}
.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;   /* 🔥 reduces gap */
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;   /* 🔥 reduces gap */
}
</style>
</head>

<body>

<div class="ticker-container">
    <div class="ticker-track" id="ticker"></div>
</div>

<script>
const socket = io();
const ticker = document.getElementById("ticker");


const elements = {};
const pendingUpdates = {};

// ✅ Connection Debug
socket.on("connect", () => {
    console.log("✅ Connected to backend");
});


let stockCount = 0;

function getOrCreateRow(rowIndex) {

    let row = document.querySelector(`[data-row="${rowIndex}"]`);

    if (!row) {
        row = document.createElement("div");
        row.className = "ticker-row";
        row.dataset.row = rowIndex;
        ticker.appendChild(row);
    }

    return row;
}
// ---------------- Create or Update Stock ----------------
function addOrUpdateStock(symbol, ltp, change, changePercent) {

    const colorClass = change < 0 ? 'down' : 'up';

    if (!elements[symbol]) {

        const el = document.createElement("div");
        el.className = "stock";
        el.dataset.symbol = symbol;

                    el.innerHTML = `
                <div class="stock-text">

                    <div>
                        <div class="symbol-ltp ${colorClass}">
                            ${symbol}
                        </div>
                        <div class="symbol-ltp ${colorClass}">
                            ${ltp}
                        </div>
                    </div>

                    <div class="change-arrow ${colorClass}" style="flex-direction: column; align-items: flex-end;">
                        <div>
                            (${changePercent}%)
                        </div>
                        <div>
                            <span class="arrow">
                                ${change >= 0 ? '▲' : '▼'}
                            </span>
                            <span>
                                ${change >= 0 ? '+' + change : change}
                            </span>
                        </div>
                    </div>

                </div>
            `;
        const rowIndex = Math.floor(Object.keys(elements).length / 5);
        const row = getOrCreateRow(rowIndex);
        row.appendChild(el);
        elements[symbol] = el;

        sortStocks();

    } else {

    const el = elements[symbol];

    // Get both symbol-ltp blocks
    const symbolBlocks = el.querySelectorAll(".symbol-ltp");

    // First = symbol, Second = price
    const priceBlock = symbolBlocks[1];

    // Change section
    const changeArrow = el.querySelector(".change-arrow");

    const percentDiv = changeArrow.children[0]; // (%)
    const changeRow = changeArrow.children[1];

    const arrow = changeRow.querySelector(".arrow");
    const changeSpan = changeRow.querySelector("span:last-child");

    // ✅ Update values
    priceBlock.textContent = ltp;
    percentDiv.textContent = `(${changePercent}%)`;
    arrow.textContent = change >= 0 ? '▲' : '▼';
    changeSpan.textContent = change >= 0 ? '+' + change : change;

    // ✅ Update colors
    symbolBlocks[0].className = `symbol-ltp ${colorClass}`;
    symbolBlocks[1].className = `symbol-ltp ${colorClass}`;
    changeArrow.className = `change-arrow ${colorClass}`;
}
}

// ---------------- Sorting + Clone Rebuild ----------------
function sortStocks() {

    const allStocks = Array.from(document.querySelectorAll(".stock"));

    allStocks.sort((a, b) =>
        a.dataset.symbol.localeCompare(b.dataset.symbol)
    );

    // clear all rows
    document.querySelectorAll(".ticker-row").forEach(r => r.remove());

    stockCount = 0;

    allStocks.forEach(stock => {
        const row = getOrCreateRow(stockCount);
        row.appendChild(stock);
        stockCount++;
    });
}

// ---------------- Batch Updates (Smooth UI) ----------------
setInterval(() => {
    for (const symbol in pendingUpdates) {
        const d = pendingUpdates[symbol];
        addOrUpdateStock(symbol, d.ltp, d.change, d.change_percent);
    }
    Object.keys(pendingUpdates).forEach(k => delete pendingUpdates[k]);
}, 1000);

// ---------------- Listen to Backend ----------------
socket.on("stock_update", data => {
    console.log("📥 Received:", data);  // 👈 ADD THIS
    pendingUpdates[data.symbol] = data;
});
</script>

</body>
</html>
