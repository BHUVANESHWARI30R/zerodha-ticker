<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Smooth 2 Screen Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: 'Teko', sans-serif;
}

.ticker-container {
    width: 100vw;
    height: 120px;
    overflow: hidden;
    position: relative;
    background: #000;
}

.ticker-wrapper {
    position: absolute;
    left: 0;
    top: 0;
    height: 120px;
    display: flex;
    align-items: center;
    width: max-content;
    will-change: transform;
    transform: translate3d(0,0,0);
    backface-visibility: hidden;
}

.ticker-track {
    display: flex;
    align-items: center;
    height: 120px;
    white-space: nowrap;
    flex-shrink: 0;
}

.stock {
    width: 310px;
    height: 110px;
    margin-right: 70px;
    flex-shrink: 0;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    letter-spacing: 1px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    line-height: 1.05;
}

.symbol {
    font-size: 43px;
    font-weight: 700;
    color: #fff;
}

.percent {
    font-size: 34px;
    font-weight: 600;
    text-align: right;
}

.price {
    font-size: 39px;
    font-weight: 600;
    color: #fff;
}

.change {
    font-size: 34px;
    font-weight: 600;
    text-align: right;
}

.price,
.percent,
.change {
    font-variant-numeric: tabular-nums;
}

.stock.up .percent,
.stock.up .change {
    color: #00ff00;
}

.stock.down .percent,
.stock.down .change {
    color: #ff2b2b;
}

.stock.flat .percent,
.stock.flat .change {
    color: #ffffff;
}

.loading {
    color: #444;
    font-size: 40px;
    padding-left: 40px;
}
</style>
</head>

<body>

<div class="ticker-container">
    <div id="tickerWrapper" class="ticker-wrapper">
        <div id="track1" class="ticker-track">
            <div class="loading">WAITING FOR LIVE DATA...</div>
        </div>
        <div id="track2" class="ticker-track"></div>
        <div id="track3" class="ticker-track"></div>
    </div>
</div>

<script>
/* ================= CONFIG ================= */

const LEFT_WIDTH = 2176;
const RIGHT_WIDTH = 2048;

const params = new URLSearchParams(window.location.search);
const SCREEN = params.get("screen") || "1";

const SCREEN_OFFSET = SCREEN === "2" ? LEFT_WIDTH : 0;

/*
    Try:
    45 = slow
    60 = normal LED ticker
    75 = faster
*/
const SPEED = 55;

const EXPECTED_SYMBOLS = 50;
const FORCE_START_AFTER_MS = 3000;

/* ================= STATE ================= */

const socket = io();

const latestStockMap = new Map();
const pendingStockMap = new Map();

let tickerSequence = [];
let cardElements = new Map();

let trackWidth = 1;
let started = false;

let serverOffset = 0;
let startServerTime = null;
let lastTextUpdate = 0;

const wrapper = document.getElementById("tickerWrapper");
const track1 = document.getElementById("track1");
const track2 = document.getElementById("track2");
const track3 = document.getElementById("track3");

/* ================= SOCKET ================= */

socket.on("connect", () => {
    console.log("Connected to backend");
});

socket.on("sync_time", data => {
    if (!data || !data.server_time) return;
    serverOffset = Number(data.server_time) - Date.now();
});

socket.on("stock_update", data => {
    const stock = normalizeStock(data);
    if (!stock.symbol) return;

    latestStockMap.set(stock.symbol, stock);
    pendingStockMap.set(stock.symbol, stock);

    if (!started && latestStockMap.size >= EXPECTED_SYMBOLS) {
        startTicker();
    }
});

/* ================= NORMALIZE ================= */

function normalizeStock(data) {
    return {
        symbol: String(data.symbol || "").trim(),
        ltp: Number(data.ltp || 0),
        change: Number(data.change || 0),
        change_percent: Number(data.change_percent || 0)
    };
}

/* ================= CARD ================= */

function cardHTML(stock) {
    const direction = getDirection(stock);
    const arrow = getArrow(stock);
    const percentSign = stock.change_percent > 0 ? "+" : "";

    return `
        <div class="stock ${direction}" data-symbol="${stock.symbol}">
            <div class="row">
                <span class="symbol">${stock.symbol}</span>
                <span class="percent">${percentSign}${stock.change_percent.toFixed(2)}%</span>
            </div>
            <div class="row">
                <span class="price">${stock.ltp.toFixed(2)}</span>
                <span class="change">${arrow} ${Math.abs(stock.change).toFixed(2)}</span>
            </div>
        </div>
    `;
}

function getDirection(stock) {
    if (stock.change > 0) return "up";
    if (stock.change < 0) return "down";
    return "flat";
}

function getArrow(stock) {
    if (stock.change > 0) return "▲";
    if (stock.change < 0) return "▼";
    return "●";
}

/* ================= START ================= */

function startTicker() {
    if (started) return;

    tickerSequence = Array.from(latestStockMap.keys()).sort();

    const html = tickerSequence.map(symbol => {
        return cardHTML(latestStockMap.get(symbol));
    }).join("");

    track1.innerHTML = html;
    track2.innerHTML = html;
    track3.innerHTML = html;

    collectCardElements();

    requestAnimationFrame(() => {
        trackWidth = track1.scrollWidth || 1;
        started = true;
        startServerTime = Date.now() + serverOffset;

        console.log("Ticker started", {
            screen: SCREEN,
            symbols: tickerSequence.length,
            trackWidth
        });
    });
}

function collectCardElements() {
    cardElements.clear();

    document.querySelectorAll(".stock").forEach(card => {
        const symbol = card.dataset.symbol;

        if (!cardElements.has(symbol)) {
            cardElements.set(symbol, []);
        }

        cardElements.get(symbol).push(card);
    });
}

/* ================= SAFE TEXT UPDATE ONLY ================= */

function applyPendingTextUpdates() {
    if (pendingStockMap.size === 0) return;

    pendingStockMap.forEach((stock, symbol) => {
        const cards = cardElements.get(symbol);
        if (!cards) return;

        const direction = getDirection(stock);
        const arrow = getArrow(stock);
        const percentSign = stock.change_percent > 0 ? "+" : "";

        cards.forEach(card => {
            card.className = `stock ${direction}`;
            card.querySelector(".percent").textContent =
                `${percentSign}${stock.change_percent.toFixed(2)}%`;
            card.querySelector(".price").textContent =
                stock.ltp.toFixed(2);
            card.querySelector(".change").textContent =
                `${arrow} ${Math.abs(stock.change).toFixed(2)}`;
        });
    });

    pendingStockMap.clear();
}

/* ================= ANIMATION ================= */

function animate() {
    requestAnimationFrame(animate);

    if (!started || trackWidth <= 1 || startServerTime === null) return;

    const now = Date.now() + serverOffset;
    const elapsed = (now - startServerTime) / 1000;

    const move = (elapsed * SPEED) % trackWidth;

    const x = -(move + SCREEN_OFFSET);

    wrapper.style.transform = `translate3d(${x}px, 0, 0)`;

    /*
        Text updates only every 1 second.
        No rebuild, no layout reset.
    */
    if (performance.now() - lastTextUpdate > 1000) {
        applyPendingTextUpdates();
        lastTextUpdate = performance.now();
    }
}

requestAnimationFrame(animate);

/* Fallback start */
setTimeout(() => {
    if (!started && latestStockMap.size > 0) {
        startTicker();
    }
}, FORCE_START_AFTER_MS);
</script>

</body>
</html>
