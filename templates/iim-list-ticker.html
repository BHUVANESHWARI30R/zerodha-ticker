<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Smooth Real-Time Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: 'Teko', sans-serif;
}

.ticker-container {
    width: 100vw;
    height: 120px;
    overflow: hidden;
    position: relative;
    background: #000;
}

.ticker-wrapper {
    position: absolute;
    left: 0;
    top: 0;
    height: 120px;
    display: flex;
    align-items: center;
    width: max-content;

    will-change: transform;
    transform: translate3d(0,0,0);
    backface-visibility: hidden;
}

.ticker-track {
    display: flex;
    align-items: center;
    height: 120px;
    white-space: nowrap;
    flex-shrink: 0;
}

/* STOCK CARD */
.stock {
    width: 310px;
    height: 110px;
    margin-right: 70px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;

    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    line-height: 1.05;
}

.symbol {
    font-size: 43px;
    font-weight: 700;
}

.percent {
    font-size: 34px;
    font-weight: 600;
    text-align: right;
}

.price {
    font-size: 39px;
    font-weight: 600;
}

.change {
    font-size: 34px;
    font-weight: 600;
    text-align: right;
}

/* WHOLE STOCK COLOR */
.stock.up,
.stock.up .symbol,
.stock.up .percent,
.stock.up .price,
.stock.up .change {
    color: #00ff00;
}

.stock.down,
.stock.down .symbol,
.stock.down .percent,
.stock.down .price,
.stock.down .change {
    color: #ff2b2b;
}

.stock.flat,
.stock.flat .symbol,
.stock.flat .percent,
.stock.flat .price,
.stock.flat .change {
    color: #ffffff;
}

.loading {
    color: #444;
    font-size: 40px;
    padding-left: 40px;
}
</style>
</head>

<body>

<div class="ticker-container">
    <div id="tickerWrapper" class="ticker-wrapper">
        <div id="track1" class="ticker-track">
            <div class="loading">WAITING FOR LIVE DATA...</div>
        </div>
        <div id="track2" class="ticker-track"></div>
        <div id="track3" class="ticker-track"></div>
        <div id="track4" class="ticker-track"></div>
        <div id="track5" class="ticker-track"></div>
    </div>
</div>

<script>
/* ---------------- CONFIG ---------------- */

const LEFT_WIDTH = 2176;
const RIGHT_WIDTH = 2048;

const params = new URLSearchParams(window.location.search);
const SCREEN = params.get("screen") || "1";

const SCREEN_OFFSET = SCREEN === "2" ? LEFT_WIDTH : 0;

/*
    Adjust this only.
    Try 45, 55, 65.
*/
const SPEED = 55;

const EXPECTED_SYMBOLS = 50;
const START_AFTER_MS = 3000;

/*
    Realtime text refresh speed.
*/
const TEXT_UPDATE_INTERVAL_MS = 250;

/* ---------------- STATE ---------------- */

const socket = io();

const latestStockMap = new Map();
const pendingStockMap = new Map();

let tickerSequence = [];
let cardElements = new Map();

let baseTrackWidth = 1;
let started = false;

let startTime = null;
let lastTextUpdate = 0;

const wrapper = document.getElementById("tickerWrapper");
const tracks = [
    document.getElementById("track1"),
    document.getElementById("track2"),
    document.getElementById("track3"),
    document.getElementById("track4"),
    document.getElementById("track5")
];

/* ---------------- SOCKET ---------------- */

socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

/*
    Do not use sync_time continuously.
    Continuous sync_time can create small jump/stutter.
*/
socket.on("sync_time", () => {});

socket.on("stock_update", data => {
    const stock = normalizeStock(data);
    if (!stock.symbol) return;

    latestStockMap.set(stock.symbol, stock);
    pendingStockMap.set(stock.symbol, stock);

    if (!started && latestStockMap.size >= EXPECTED_SYMBOLS) {
        startTicker();
    }
});

/* ---------------- DATA ---------------- */

function normalizeStock(data) {
    return {
        symbol: String(data.symbol || "").trim(),
        ltp: Number(data.ltp || 0),
        change: Number(data.change || 0),
        change_percent: Number(data.change_percent || 0)
    };
}

/* ---------------- CARD ---------------- */

function getDirection(stock) {
    if (stock.change > 0) return "up";
    if (stock.change < 0) return "down";
    return "flat";
}

function getArrow(stock) {
    if (stock.change > 0) return "▲";
    if (stock.change < 0) return "▼";
    return "●";
}

function cardHTML(stock) {
    const direction = getDirection(stock);
    const arrow = getArrow(stock);
    const percentSign = stock.change_percent > 0 ? "+" : "";

    return `
        <div class="stock ${direction}" data-symbol="${stock.symbol}">
            <div class="row">
                <span class="symbol">${stock.symbol}</span>
                <span class="percent">${percentSign}${stock.change_percent.toFixed(2)}%</span>
            </div>
            <div class="row">
                <span class="price">${stock.ltp.toFixed(2)}</span>
                <span class="change">${arrow} ${Math.abs(stock.change).toFixed(2)}</span>
            </div>
        </div>
    `;
}

/* ---------------- START ---------------- */

function startTicker() {
    if (started) return;

    tickerSequence = Array.from(latestStockMap.keys()).sort();

    const html = tickerSequence
        .map(symbol => cardHTML(latestStockMap.get(symbol)))
        .join("");

    tracks.forEach(track => {
        track.innerHTML = html;
    });

    collectCards();

    requestAnimationFrame(() => {
        baseTrackWidth = tracks[0].scrollWidth || 1;
        startTime = performance.now();
        started = true;

        console.log("✅ Ticker started", {
            screen: SCREEN,
            symbols: tickerSequence.length,
            baseTrackWidth
        });
    });
}

function collectCards() {
    cardElements.clear();

    document.querySelectorAll(".stock").forEach(card => {
        const symbol = card.dataset.symbol;

        if (!cardElements.has(symbol)) {
            cardElements.set(symbol, []);
        }

        cardElements.get(symbol).push(card);
    });
}

/* ---------------- REALTIME TEXT UPDATE ---------------- */

function applyRealtimeTextUpdates() {
    if (pendingStockMap.size === 0) return;

    pendingStockMap.forEach((stock, symbol) => {
        const cards = cardElements.get(symbol);
        if (!cards) return;

        const direction = getDirection(stock);
        const arrow = getArrow(stock);
        const percentSign = stock.change_percent > 0 ? "+" : "";

        cards.forEach(card => {
            card.className = `stock ${direction}`;
            card.querySelector(".percent").textContent =
                `${percentSign}${stock.change_percent.toFixed(2)}%`;
            card.querySelector(".price").textContent =
                stock.ltp.toFixed(2);
            card.querySelector(".change").textContent =
                `${arrow} ${Math.abs(stock.change).toFixed(2)}`;
        });
    });

    pendingStockMap.clear();
}

/* ---------------- SMOOTH SCROLL ---------------- */

function animate(now) {
    requestAnimationFrame(animate);

    if (!started || !startTime || baseTrackWidth <= 1) return;

    const elapsed = (now - startTime) / 1000;

    /*
        This never stops.
        It loops only by baseTrackWidth.
        Extra tracks keep screen 2 filled.
    */
    const move = (elapsed * SPEED) % baseTrackWidth;

    const x = -(move + SCREEN_OFFSET);

    wrapper.style.transform = `translate3d(${x}px, 0, 0)`;

    if (now - lastTextUpdate >= TEXT_UPDATE_INTERVAL_MS) {
        applyRealtimeTextUpdates();
        lastTextUpdate = now;
    }
}

requestAnimationFrame(animate);

/* fallback */
setTimeout(() => {
    if (!started && latestStockMap.size > 0) {
        startTicker();
    }
}, START_AFTER_MS);

</script>

</body>
</html>
