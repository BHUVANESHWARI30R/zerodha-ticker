<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Final Smooth Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: 'Teko', sans-serif;
}

/* CONTAINER */
.ticker-container {
    width: 100vw;
    height: 120px;
    overflow: hidden;
}

/* MOVING LAYER */
.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0,0,0);
}

/* TRACK */
.ticker-track {
    display: flex;
}

/* STOCK CARD */
.stock {
    width: 430px;
    height: 110px;
    margin-right: 40px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-variant-numeric: tabular-nums;
}

/* DEBUG LINE FOR SCREEN SPLIT */
.split-line {
    position: fixed;
    top: 0;
    left: 2176px; /* exact boundary */
    width: 2px;
    height: 240px; /* both rows */
    background: yellow;
    z-index: 9999;
    pointer-events: none;
}

/* ROW LAYOUT */
.row {
    display: grid;
    grid-template-columns: auto 150px;
    align-items: center;
    white-space: nowrap;   /* 🔥 prevents breaking */
}

/* TEXT */
.symbol {
    font-size: 42px;
    font-weight: 700;
    white-space: nowrap;
}

.percent {
    font-size: 42px;
    font-weight: 700;
    text-align: right;
}

.price {
    font-size: 42px;
    font-weight: 700;
    white-space: nowrap;
}

.change {
    font-size: 42px;
    font-weight: 700;
    text-align: right;
}

/* COLORS */
.stock.up, .stock.up * {
    color: #00ff00;
}

.stock.down, .stock.down * {
    color: #ff2b2b;
}

.stock.flat, .stock.flat * {
    color: #ffffff;
}
</style>
</head>

<body>

    <div class="split-line"></div> 
<div class="ticker-container">

    <div id="wrapper" class="ticker-wrapper">
        <div id="track1" class="ticker-track"></div>
        <div id="track2" class="ticker-track"></div>
        <div id="track3" class="ticker-track"></div>
        <div id="track4" class="ticker-track"></div>
    </div>
</div>

<script>
/* ================= CONFIG ================= */

const LEFT_WIDTH = 2176;
const SCREEN = new URLSearchParams(location.search).get("screen") || "1";
const OFFSET = SCREEN === "2" ? LEFT_WIDTH : 0;

const SPEED = 80; // 🔥 smooth speed

/* ================= STATE ================= */

const socket = io();

const latest = new Map();
const cards = new Map();

let sequence = [];
let width = 1;
let started = false;

const wrapper = document.getElementById("wrapper");
const tracks = [
    document.getElementById("track1"),
    document.getElementById("track2"),
    document.getElementById("track3"),
    document.getElementById("track4")
];

/* ================= SOCKET ================= */

socket.on("stock_update", data => {
    const s = {
        symbol: data.symbol,
        ltp: +data.ltp,
        change: +data.change,
        pct: +data.change_percent
    };

    latest.set(s.symbol, s);

    if (!started && latest.size >= 40) {
        startTicker();
    }

    updateCard(s);
});

/* ================= START ================= */

function startTicker() {
    sequence = Array.from(latest.keys()).sort();

    const html = sequence.map(sym => renderCard(latest.get(sym))).join("");

    tracks.forEach(t => t.innerHTML = html);

    mapCards();

    requestAnimationFrame(() => {
        width = tracks[0].scrollWidth;
        started = true;
    });
}

/* ================= CARD ================= */

function renderCard(s) {
    const dir = s.change > 0 ? "up" : s.change < 0 ? "down" : "flat";
    const arrow = s.change > 0 ? "▲" : s.change < 0 ? "▼" : "●";
    const sign = s.pct > 0 ? "+" : "";

    return `
    <div class="stock ${dir}" data-s="${s.symbol}">
        <div class="row">
            <div class="symbol">${s.symbol}</div>
            <div class="percent">${sign}${s.pct.toFixed(2)}%</div>
        </div>
        <div class="row">
            <div class="price">${s.ltp.toFixed(2)}</div>
            <div class="change">${arrow} ${Math.abs(s.change).toFixed(2)}</div>
        </div>
    </div>`;
}

function mapCards() {
    cards.clear();

    document.querySelectorAll(".stock").forEach(el => {
        const s = el.dataset.s;
        if (!cards.has(s)) cards.set(s, []);
        cards.get(s).push(el);
    });
}

/* ================= REALTIME UPDATE ================= */

function updateCard(s) {
    const list = cards.get(s.symbol);
    if (!list) return;

    const dir = s.change > 0 ? "up" : s.change < 0 ? "down" : "flat";
    const arrow = s.change > 0 ? "▲" : s.change < 0 ? "▼" : "●";
    const sign = s.pct > 0 ? "+" : "";

    list.forEach(el => {
        el.className = `stock ${dir}`;
        el.querySelector(".percent").textContent = `${sign}${s.pct.toFixed(2)}%`;
        el.querySelector(".price").textContent = s.ltp.toFixed(2);
        el.querySelector(".change").textContent = `${arrow} ${Math.abs(s.change).toFixed(2)}`;
    });
}

/* ================= SMOOTH SCROLL ================= */

let start = performance.now();

function animate(now) {
    requestAnimationFrame(animate);

    if (!started) return;

    const t = (now - start) / 1000;
    const move = (t * SPEED) % width;

    wrapper.style.transform = `translate3d(${-(move + OFFSET)}px,0,0)`;
}

requestAnimationFrame(animate);
</script>

</body>
</html>
