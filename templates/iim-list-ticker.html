<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

body {
    line-height: 1;
}

.page {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    position: relative;
    margin: 0;
    padding: 0;
}

.list1-row {
    width: 2176px;   /* LEFT SCREEN */
    height: 128px;
}

.list2-row {
    width: 2048px;   /* RIGHT SCREEN */
    height: 128px;
    border-top: none;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    margin: 0;
    padding: 0;
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    width: max-content;
    flex-shrink: 0;
    margin: 0;
    padding: 0;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
    flex-shrink: 0;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
    white-space: nowrap;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;
}

.arrow {
    margin-right: 2px;
}

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>

<div class="page">
    <div class="ticker-row list1-row" id="row1">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
            <div class="ticker" id="ticker1-clone"></div>
        </div>
    </div>

    <div class="ticker-row list2-row" id="row2">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
            <div class="ticker" id="ticker2-clone"></div>
        </div>
    </div>
</div>

<script>
console.log("FINAL SYNC TICKER LOADED");

const socket = io();

/* ---------------- DOM ---------------- */
const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const ticker1 = document.getElementById("ticker1");
const ticker1Clone = document.getElementById("ticker1-clone");

const ticker2 = document.getElementById("ticker2");
const ticker2Clone = document.getElementById("ticker2-clone");

const row1 = document.getElementById("row1");
const row2 = document.getElementById("row2");

/* ---------------- SCREEN MODE ---------------- */
const params = new URLSearchParams(window.location.search);
const screenMode = params.get("screen") || "both";

if (screenMode === "1") row2.remove();
if (screenMode === "2") row1.remove();

/* ---------------- CONSTANTS ---------------- */
const LEFT_SCREEN_WIDTH = 2176;
const SPEED = 0.03;
const START_TIME = 1700000000000;
const UPDATE_INTERVAL_MS = 200;

/* ---------------- DATA ---------------- */
const set4Map = new Map();   // master latest state

let displayQueue = [];
let nextQueue = [];

let cycleWidth = 0;
let lastX = 0;
let firstRenderDone = false;

/* ---------------- SOCKET ---------------- */

// 🔥 FULL SNAPSHOT (VERY IMPORTANT)
socket.on("ticker_snapshot", (data) => {
    console.log("📦 Snapshot received");

    set4Map.clear();

    data.forEach(item => {
        set4Map.set(item.symbol, item);
    });

    loadNextBatch();   // same start for all screens
    firstRenderDone = true;
});

// realtime updates
socket.on("stock_update", (data) => {
    set4Map.set(data.symbol, data); // ONLY update Set 4
});

/* ---------------- UI ---------------- */
function formatSignedNumber(v) {
    return v >= 0 ? `+${v}` : `${v}`;
}

function makeStockHTML(d) {
    const color = d.change < 0 ? "down" : "up";
    const arrow = d.change >= 0 ? "▲" : "▼";

    return `
    <div class="stock">
        <div class="stock-text">
            <div>
                <div class="symbol-ltp ${color}">${d.symbol}</div>
                <div class="symbol-ltp ${color}">${d.ltp}</div>
            </div>

            <div class="change-arrow ${color}" style="flex-direction: column; align-items: flex-end;">
                <div>(${d.change_percent}%)</div>
                <div>
                    <span class="arrow">${arrow}</span>
                    <span>${formatSignedNumber(d.change)}</span>
                </div>
            </div>
        </div>
    </div>`;
}

/* ---------------- BUILD BATCH ---------------- */
function buildSortedSet4() {
    return Array.from(set4Map.values())
        .sort((a, b) => a.symbol.localeCompare(b.symbol));
}

/* ---------------- RENDER ---------------- */
function renderTicker(queue) {
    if (!queue.length) return;

    const html = queue.map(makeStockHTML).join("");

    ticker1.innerHTML = html;
    ticker1Clone.innerHTML = html;

    ticker2.innerHTML = html;
    ticker2Clone.innerHTML = html;

    cycleWidth = ticker1.scrollWidth;
}

/* ---------------- LOAD NEXT BATCH ---------------- */
function loadNextBatch() {
    const batch = buildSortedSet4();
    if (!batch.length) return;

    nextQueue = batch.map(i => ({ ...i }));

    displayQueue = nextQueue;
    renderTicker(displayQueue);
}

/* ---------------- ANIMATION ---------------- */
function animate() {
    requestAnimationFrame(animate);

    if (!cycleWidth) return;

    const now = Date.now() - START_TIME;
    const x = (now * SPEED) % cycleWidth;

    // 🔥 LOOP COMPLETE
    if (x < lastX) {
        loadNextBatch(); // update ONLY here
    }

    lastX = x;

    const left = x;
    const right = x + LEFT_SCREEN_WIDTH;

    if (screenMode !== "2") {
        wrapper1.style.transform = `translate3d(${-left}px,0,0)`;
    }

    if (screenMode !== "1") {
        wrapper2.style.transform = `translate3d(${-right}px,0,0)`;
    }
}

/* ---------------- START ---------------- */
animate();
</script>

</body>
