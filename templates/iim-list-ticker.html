<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.page {
    width: 100%;
    display: flex;
    flex-direction: column;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
}

.list1-row {
    width: 2176px;
    height: 128px;
}

.list2-row {
    width: 2048px;
    height: 128px;
}

/* GPU layer */
.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0,0,0);
    transform: translateZ(0);
    backface-visibility: hidden;
}

.ticker {
    display: flex;
    white-space: nowrap;
}

/* UI unchanged */
.stock {
    display: flex;
    align-items: center;
    margin-right: 80px;
    min-width: 260px;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-size: 55px;
    font-weight: bold;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
}

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>

<div class="page">

    <!-- LEFT -->
    <div class="ticker-row list1-row">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="ticker-row list2-row">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
        </div>
    </div>

</div>

<script>
const socket = io();

const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const ticker1 = document.getElementById("ticker1");
const ticker2 = document.getElementById("ticker2");

const LEFT_SCREEN_WIDTH = 2176;

/* ---------------- DATA ---------------- */
let displayQueue = [];
let pendingUpdates = {};
let queue3State = new Map();

/* ---------------- SYNC ENGINE ---------------- */
let cycleWidth = 0;

/* 🔥 absolute-time speed */
const SPEED = 0.02;

/* optional global sync start (same for all screens) */
const START_TIME = 1700000000000;

/* ---------------- SOCKET ---------------- */
socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- UI ---------------- */
function formatSignedNumber(value) {
    return value >= 0 ? `+${value}` : value;
}

function makeStockHTML(data) {
    const colorClass = data.change < 0 ? "down" : "up";
    const arrow = data.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock">
            <div class="stock-text">
                <div>
                    <div class="symbol-ltp ${colorClass}">${data.symbol}</div>
                    <div class="symbol-ltp ${colorClass}">${data.ltp}</div>
                </div>

                <div class="change-arrow ${colorClass}" style="flex-direction: column; align-items: flex-end;">
                    <div>(${data.change_percent}%)</div>
                    <div>
                        <span class="arrow">${arrow}</span>
                        <span>${formatSignedNumber(data.change)}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
}

/* ---------------- RENDER ---------------- */
function renderTicker() {
    if (!displayQueue.length) return;

    const html = displayQueue.map(makeStockHTML).join("");

    ticker1.innerHTML = html + html;
    ticker2.innerHTML = html + html;

    cycleWidth = ticker1.scrollWidth / 2;
}

/* ---------------- PERFECT SYNC SCROLL ---------------- */
function animate() {
    requestAnimationFrame(animate);

    if (!cycleWidth) return;

    const now = Date.now() - START_TIME;

    const x = (now * SPEED) % cycleWidth;

    const leftOffset = x;
    const rightOffset = x + LEFT_SCREEN_WIDTH;

    wrapper1.style.transform = `translate3d(${-leftOffset}px,0,0)`;
    wrapper2.style.transform = `translate3d(${-rightOffset}px,0,0)`;
}

/* ---------------- UPDATE QUEUE ---------------- */
setInterval(() => {
    const symbols = Object.keys(pendingUpdates);
    if (!symbols.length) return;

    const now = Date.now();

    for (const symbol of symbols) {
        const data = pendingUpdates[symbol];

        queue3State.set(symbol, {
            ...data,
            ts: now
        });

        delete pendingUpdates[symbol];
    }

    const nextQueue = [];

    for (const [, data] of queue3State) {
        nextQueue.push(data);
    }

    nextQueue.sort((a, b) => a.symbol.localeCompare(b.symbol));

    displayQueue = nextQueue;

    renderTicker();

}, 300);


/* ---------------- START ---------------- */
animate();
</script>

</body>
</html>
