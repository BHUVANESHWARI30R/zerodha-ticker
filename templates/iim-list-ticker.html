<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Smooth Pro Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

/* SCREENS */
.ticker-row {
    overflow: hidden;
    position: relative;
}

.left {
    width: 2176px;
    height: 120px;
}

.right {
    width: 2048px;
    height: 120px;
}

/* MOVING LAYER */
.wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0,0,0);
    backface-visibility: hidden;
}

/* CONTENT */
.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
}

/* STOCK BLOCK */
.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 28px;
}

.symbol-ltp {
    font-size: 55px;
    font-weight: bold;
    line-height: 1.1;
}

.change {
    font-size: 55px;
    font-weight: bold;
}

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>

<!-- LEFT SCREEN -->
<div class="ticker-row left">
    <div class="wrapper" id="wrapper1">
        <div class="ticker" id="ticker1"></div>
        <div class="ticker" id="ticker1-clone"></div>
    </div>
</div>

<!-- RIGHT SCREEN -->
<div class="ticker-row right">
    <div class="wrapper" id="wrapper2">
        <div class="ticker" id="ticker2"></div>
        <div class="ticker" id="ticker2-clone"></div>
    </div>
</div>

<script>
const socket = io();

const ticker1 = document.getElementById("ticker1");
const ticker1Clone = document.getElementById("ticker1-clone");

const ticker2 = document.getElementById("ticker2");
const ticker2Clone = document.getElementById("ticker2-clone");

const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const LEFT_WIDTH = 2176;

let displayQueue = [];
let pendingUpdates = {};

let globalX = 0;
let cycleWidth = 0;

const SPEED = 2.2; // 🔧 adjust here

/* ---------------- socket ---------------- */
socket.on("connect", () => {
    console.log("✅ Connected");
});

socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- helpers ---------------- */
function formatSigned(value) {
    return value >= 0 ? `+${value}` : value;
}

function makeHTML(d) {
    const cls = d.change >= 0 ? "up" : "down";
    const arrow = d.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock">
            <div class="stock-text">
                <div class="symbol-ltp ${cls}">
                    ${d.symbol} ${d.ltp}
                </div>

                <div class="change ${cls}">
                    ${arrow} ${formatSigned(d.change)}
                </div>
            </div>
        </div>
    `;
}

/* ---------------- render ---------------- */
function render() {
    if (!displayQueue.length) return;

    const html = displayQueue.map(makeHTML).join("");

    ticker1.innerHTML = html;
    ticker1Clone.innerHTML = html;

    ticker2.innerHTML = html;
    ticker2Clone.innerHTML = html;

    cycleWidth = ticker1.scrollWidth;
}

/* ---------------- smooth animation ---------------- */
let lastTime = performance.now();

function animate(now) {
    requestAnimationFrame(animate);

    if (!cycleWidth) return;

    const delta = now - lastTime;
    lastTime = now;

    globalX += SPEED * (delta / 16.67);

    if (globalX >= cycleWidth) {
        globalX -= cycleWidth;
    }

    const leftOffset = globalX % cycleWidth;
    const rightOffset = (globalX + LEFT_WIDTH) % cycleWidth;

    wrapper1.style.transform = `translate3d(${-leftOffset}px,0,0)`;
    wrapper2.style.transform = `translate3d(${-rightOffset}px,0,0)`;
}

/* ---------------- update queue (no flicker) ---------------- */
setInterval(() => {
    const keys = Object.keys(pendingUpdates);
    if (!keys.length) return;

    for (const k of keys) {
        const existing = displayQueue.find(x => x.symbol === k);

        if (existing) {
            Object.assign(existing, pendingUpdates[k]);
        } else {
            displayQueue.push(pendingUpdates[k]);
        }

        delete pendingUpdates[k];
    }

    render();
}, 300);


animate();
</script>

</body>
</html>
