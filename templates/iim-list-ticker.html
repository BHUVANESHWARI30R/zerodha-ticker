<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

body { line-height: 1; }

.page {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    position: relative;
    margin: 0;
    padding: 0;
}

.list1-row {
    width: 2176px;
    height: 128px;
}

.list2-row {
    width: 2048px;
    height: 128px;
    border-top: none;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    margin: 0;
    padding: 0;
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    width: max-content;
    flex-shrink: 0;
    margin: 0;
    padding: 0;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
    flex-shrink: 0;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
    white-space: nowrap;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;
}

.arrow { margin-right: 2px; }

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>

<div class="page">
    <div class="ticker-row list1-row" id="row1">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
            <div class="ticker" id="ticker1-clone"></div>
        </div>
    </div>

    <div class="ticker-row list2-row" id="row2">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
            <div class="ticker" id="ticker2-clone"></div>
        </div>
    </div>
</div>

<script>
console.log("FINAL SNAPSHOT SYNC TICKER LOADED");

const socket = io();

const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const ticker1 = document.getElementById("ticker1");
const ticker1Clone = document.getElementById("ticker1-clone");

const ticker2 = document.getElementById("ticker2");
const ticker2Clone = document.getElementById("ticker2-clone");

const row1 = document.getElementById("row1");
const row2 = document.getElementById("row2");

/* ---------------- SCREEN MODE ---------------- */
const params = new URLSearchParams(window.location.search);
const screenMode = params.get("screen") || "both";

if (screenMode === "1") row2.remove();
if (screenMode === "2") row1.remove();

/* ---------------- CONSTANTS ---------------- */
const LEFT_SCREEN_WIDTH = 2176;
const RIGHT_SCREEN_WIDTH = 2048;
const TOTAL_WIDTH = LEFT_SCREEN_WIDTH + RIGHT_SCREEN_WIDTH;

const SPEED = 0.03;
const START_TIME = 1700000000000;

/* ---------------- DATA MODEL ----------------
   set4Map = realtime latest values, no duplicates
   displayQueue = currently visible frozen ticker
   nextQueue = next full updated batch, applied only after full loop
*/
const set4Map = new Map();

let displayQueue = [];
let nextQueue = [];

let cycleWidth = 0;
let lastX = 0;
let hasSnapshot = false;

/* ---------------- SOCKET ---------------- */
socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

socket.on("connect_error", (err) => {
    console.error("❌ connect_error:", err);
});

/*
  IMPORTANT:
  Backend must send full sorted stock list on connect.

  Example payload:
  [
    {symbol:"AXISBANK", ltp:1361.2, change:-8.4, change_percent:-0.61},
    ...
  ]
*/
socket.on("ticker_snapshot", (data) => {
    console.log("📦 ticker_snapshot received:", data.length);

    if (!Array.isArray(data) || data.length === 0) {
        console.warn("⚠️ Empty snapshot received");
        return;
    }

    set4Map.clear();

    data.forEach(item => {
        if (item && item.symbol) {
            set4Map.set(item.symbol, normalizeStock(item));
        }
    });

    nextQueue = buildSortedSet4();

    displayQueue = nextQueue.map(item => ({ ...item }));
    renderTicker(displayQueue);

    hasSnapshot = true;
});

/*
  Realtime updates ONLY update Set 4.
  They do NOT rebuild the visible ticker immediately.
*/
socket.on("stock_update", (data) => {
    if (!data || !data.symbol) return;

    const old = set4Map.get(data.symbol) || {};
    set4Map.set(data.symbol, normalizeStock({ ...old, ...data }));

    if (hasSnapshot) {
        nextQueue = buildSortedSet4();
    }
});

/* ---------------- HELPERS ---------------- */
function normalizeStock(d) {
    return {
        symbol: d.symbol,
        ltp: d.ltp ?? "",
        change: Number(d.change ?? 0),
        change_percent: Number(d.change_percent ?? 0)
    };
}

function formatSignedNumber(v) {
    const n = Number(v || 0);
    return n >= 0 ? `+${n}` : `${n}`;
}

function makeStockHTML(d) {
    const color = d.change < 0 ? "down" : "up";
    const arrow = d.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock" data-symbol="${d.symbol}">
            <div class="stock-text">
                <div>
                    <div class="symbol-ltp ${color}">${d.symbol}</div>
                    <div class="symbol-ltp ${color}">${d.ltp}</div>
                </div>

                <div class="change-arrow ${color}" style="flex-direction: column; align-items: flex-end;">
                    <div>(${d.change_percent}%)</div>
                    <div>
                        <span class="arrow">${arrow}</span>
                        <span>${formatSignedNumber(d.change)}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function buildSortedSet4() {
    return Array.from(set4Map.values())
        .sort((a, b) => a.symbol.localeCompare(b.symbol))
        .map(item => ({ ...item }));
}

/* ---------------- RENDER ---------------- */
function clearTicker() {
    if (ticker1) ticker1.innerHTML = "";
    if (ticker1Clone) ticker1Clone.innerHTML = "";
    if (ticker2) ticker2.innerHTML = "";
    if (ticker2Clone) ticker2Clone.innerHTML = "";
    cycleWidth = 0;
}

function renderTicker(queue) {
    if (!queue.length) {
        clearTicker();
        return;
    }

    const baseHTML = queue.map(makeStockHTML).join("");

    /*
      Make the ribbon long enough.
      This prevents empty gaps when the available stock count is small.
    */
    let repeatedHTML = baseHTML;

    ticker1.innerHTML = repeatedHTML;
    let width = ticker1.scrollWidth;

    const minWidth = TOTAL_WIDTH * 3;

    while (width < minWidth) {
        repeatedHTML += baseHTML;
        ticker1.innerHTML = repeatedHTML;
        width = ticker1.scrollWidth;
    }

    if (screenMode === "1") {
        ticker1.innerHTML = repeatedHTML;
        ticker1Clone.innerHTML = repeatedHTML;
        cycleWidth = ticker1.scrollWidth;
        return;
    }

    if (screenMode === "2") {
        ticker2.innerHTML = repeatedHTML;
        ticker2Clone.innerHTML = repeatedHTML;
        cycleWidth = ticker2.scrollWidth;
        return;
    }

    ticker1.innerHTML = repeatedHTML;
    ticker1Clone.innerHTML = repeatedHTML;

    ticker2.innerHTML = repeatedHTML;
    ticker2Clone.innerHTML = repeatedHTML;

    cycleWidth = ticker1.scrollWidth;
}

/* ---------------- ANIMATION ---------------- */
function animate() {
    requestAnimationFrame(animate);

    if (!cycleWidth) return;

    const now = Date.now() - START_TIME;
    const x = (now * SPEED) % cycleWidth;

    /*
      Apply realtime-updated Set 4 only after one full ribbon loop.
      During movement, visible ticker is frozen.
    */
    if (x < lastX) {
        if (hasSnapshot && nextQueue.length > 0) {
            const oldSig = displayQueue.map(i => `${i.symbol}:${i.ltp}:${i.change}:${i.change_percent}`).join("|");
            const newSig = nextQueue.map(i => `${i.symbol}:${i.ltp}:${i.change}:${i.change_percent}`).join("|");

            if (oldSig !== newSig) {
                displayQueue = nextQueue.map(item => ({ ...item }));
                renderTicker(displayQueue);
            }
        }
    }

    lastX = x;

    const leftOffset = x;
    const rightOffset = x + LEFT_SCREEN_WIDTH;

    if (screenMode !== "2") {
        wrapper1.style.transform = `translate3d(${-leftOffset}px,0,0)`;
    }

    if (screenMode !== "1") {
        wrapper2.style.transform = `translate3d(${-rightOffset}px,0,0)`;
    }
}

/* ---------------- START ---------------- */
animate();
</script>

</body>
</html>
