<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.page {
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding-top: 2px;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    position: relative;
}

.list1-row {
    width: 2176px;
    height: 120px;
}

.list2-row {
    width: 2048px;
    height: 120px;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0, 0, 0);
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    min-width: 200%;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
    flex-shrink: 0;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
    white-space: nowrap;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;
}

.arrow {
    margin-right: 2px;
}

.up { color: lime; }
.down { color: red; }

.list2-row {
    border-top: 1px solid rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<div class="page">
    <div class="ticker-row list1-row">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
            <div class="ticker" id="ticker1-clone"></div>
        </div>
    </div>

    <div class="ticker-row list2-row">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
            <div class="ticker" id="ticker2-clone"></div>
        </div>
    </div>
</div>

<script>
console.log("SCRIPT LOADED");

const socket = io();

const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const ticker1 = document.getElementById("ticker1");
const ticker1Clone = document.getElementById("ticker1-clone");

const ticker2 = document.getElementById("ticker2");
const ticker2Clone = document.getElementById("ticker2-clone");

/* =========================================================
   QUEUE MODEL
   Queue1 = visible top row
   Queue2 = visible second row
   Queue3 = realtime state store (all stocks, latest data)
   Queue4 = sorted batch-ready feeder
========================================================= */

let queue1 = [];
let queue2 = [];
let queue4 = [];

/* queue3 is represented as maps for cleaner realtime state */
const queue3State = new Map();      // symbol -> latest payload
const queue4Set = new Set();        // tracks symbols currently in queue4
const queue1Set = new Set();
const queue2Set = new Set();

const pendingUpdates = {};

/* tunables */
const TARGET_Q1 = 12;
const TARGET_Q2 = 12;

const SPEED1 = 1.8;
const SPEED2 = 1.8;

/* freshness window for queue4 admission */
const FRESH_MS = 15000;

/* batch builder timing */
const QUEUE4_BUILD_MS = 1000;
const APPLY_UPDATES_MS = 200;

let pos1 = 0;
let pos2 = 0;
let needsRender = true;

/* master sorted symbol order from backend universe */
const MASTER_SYMBOLS = [
    "ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO",
    "BAJFINANCE","BAJAJFINSV","BEL","BHARTIARTL","CIPLA","COALINDIA",
    "DRREDDY","EICHERMOT","GRASIM","HCLTECH","HDFCBANK","HDFCLIFE",
    "HINDALCO","HINDUNILVR","ICICIBANK","INDUSINDBK","INDIGO","INFY","ITC",
    "JIOFIN","JSWSTEEL","KOTAKBANK","LT","M&M","MARUTI","MAXHEALTH",
    "NESTLEIND","NTPC","ONGC","POWERGRID","RELIANCE","SBILIFE","SBIN",
    "SHRIRAMFIN","SUNPHARMA","TATACONSUM","TATAMOTORS","TATASTEEL","TCS",
    "TECHM","TITAN","TRENT","ULTRACEMCO","WIPRO"
].sort();

/* ---------------- socket events ---------------- */
socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

socket.on("connect_error", (err) => {
    console.error("❌ connect_error:", err);
});

socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- helpers ---------------- */
function formatSignedNumber(value) {
    return value >= 0 ? `+${value}` : `${value}`;
}

function makeStockHTML(data) {
    const colorClass = data.change < 0 ? "down" : "up";
    const arrow = data.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock" data-symbol="${data.symbol}">
            <div class="stock-text">
                <div>
                    <div class="symbol-ltp ${colorClass}">${data.symbol}</div>
                    <div class="symbol-ltp ${colorClass}">${data.ltp}</div>
                </div>

                <div class="change-arrow ${colorClass}" style="flex-direction: column; align-items: flex-end;">
                    <div>(${data.change_percent}%)</div>
                    <div>
                        <span class="arrow">${arrow}</span>
                        <span>${formatSignedNumber(data.change)}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function renderQueue(queue, container, cloneContainer) {
    const html = queue.map(makeStockHTML).join("");
    container.innerHTML = html;
    cloneContainer.innerHTML = html;
}

function rerenderAll() {
    renderQueue(queue1, ticker1, ticker1Clone);
    renderQueue(queue2, ticker2, ticker2Clone);

    if (queue1.length === 0) {
        pos1 = 0;
        wrapper1.style.transform = "translate3d(0,0,0)";
    }

    if (queue2.length === 0) {
        pos2 = 0;
        wrapper2.style.transform = "translate3d(0,0,0)";
    }

    needsRender = false;
}

function getFirstItemWidth(tickerEl) {
    const first = tickerEl.children[0];
    if (!first) return 0;

    const style = getComputedStyle(first);
    return first.offsetWidth + parseFloat(style.marginRight || 0);
}

function isFresh(entry) {
    if (!entry || !entry.ts) return false;
    return (Date.now() - entry.ts) <= FRESH_MS;
}

function updateQueueItem(queue, symbol, data) {
    const idx = queue.findIndex(item => item.symbol === symbol);
    if (idx !== -1) {
        queue[idx] = { ...queue[idx], ...data };
        needsRender = true;
        return true;
    }
    return false;
}

/* ---------------- queue3 realtime state ----------------
   Store latest payload + timestamp
*/
function applyPendingUpdatesToQueue3() {
    const symbols = Object.keys(pendingUpdates);
    if (symbols.length === 0) return;

    const now = Date.now();

    for (const symbol of symbols) {
        const data = pendingUpdates[symbol];

        const enriched = {
            ...data,
            ts: now,
            ready: true
        };

        queue3State.set(symbol, enriched);

        /* update anywhere visible immediately if present */
        updateQueueItem(queue1, symbol, enriched);
        updateQueueItem(queue2, symbol, enriched);

        /* if already in queue4, keep payload fresh there too */
        const idx4 = queue4.findIndex(item => item.symbol === symbol);
        if (idx4 !== -1) {
            queue4[idx4] = { ...queue4[idx4], ...enriched };
            needsRender = true;
        }

        delete pendingUpdates[symbol];
    }
}

/* ---------------- queue4 batch builder ----------------
   Build queue4 from queue3 in sorted order based on freshness.
   queue4 is not an infinite loop source; it's a prepared feeder.
*/
function buildQueue4Batch() {
    for (const symbol of MASTER_SYMBOLS) {
        const entry = queue3State.get(symbol);
        if (!isFresh(entry)) continue;

        const alreadyVisible = queue1Set.has(symbol) || queue2Set.has(symbol);
        const alreadyQueued = queue4Set.has(symbol);

        if (!alreadyVisible && !alreadyQueued) {
            queue4.push({ ...entry });
            queue4Set.add(symbol);
            needsRender = true;
        }
    }
}

/* ---------------- queue membership rebuild ---------------- */
function rebuildVisibleSets() {
    queue1Set.clear();
    queue2Set.clear();

    for (const item of queue1) queue1Set.add(item.symbol);
    for (const item of queue2) queue2Set.add(item.symbol);
}

/* ---------------- feed queue2 from queue4 ---------------- */
function feedQueue2FromQueue4() {
    while (queue2.length < TARGET_Q2 && queue4.length > 0) {
        const item = queue4.shift();
        queue4Set.delete(item.symbol);

        if (!queue2Set.has(item.symbol) && !queue1Set.has(item.symbol)) {
            queue2.push(item);
            queue2Set.add(item.symbol);
            needsRender = true;
        }
    }
}

/* ---------------- feed queue1 from queue2 only initially/if short ---------------- */
function feedQueue1FromQueue2() {
    while (queue1.length < TARGET_Q1 && queue2.length > 0) {
        const item = queue2.shift();
        queue2Set.delete(item.symbol);

        if (!queue1Set.has(item.symbol)) {
            queue1.push(item);
            queue1Set.add(item.symbol);
            needsRender = true;
        }
    }
}

/* ---------------- movement logic ----------------
   queue2 exit -> goes immediately to end of queue1
   queue1 exit -> removed from visible flow
   it is NOT pushed back directly; queue4 batch builder will re-admit it later
   if it is still fresh and eligible
*/
function onQueue2ItemExited() {
    if (queue2.length === 0) return;

    const exited = queue2.shift();
    queue2Set.delete(exited.symbol);

    if (!queue1Set.has(exited.symbol)) {
        queue1.push(exited);
        queue1Set.add(exited.symbol);
        needsRender = true;
    }

    feedQueue2FromQueue4();
}

function onQueue1ItemExited() {
    if (queue1.length === 0) return;

    const exited = queue1.shift();
    queue1Set.delete(exited.symbol);
    needsRender = true;

    /* do not instantly loop it back */
    /* it can be reintroduced later by queue4 batch build if still fresh */

    if (queue2.length > 0) {
        const moved = queue2.shift();
        queue2Set.delete(moved.symbol);

        if (!queue1Set.has(moved.symbol)) {
            queue1.push(moved);
            queue1Set.add(moved.symbol);
            needsRender = true;
        }
    }

    feedQueue2FromQueue4();
}

/* ---------------- animation ---------------- */
function animate() {
    requestAnimationFrame(animate);

    if (needsRender) {
        rerenderAll();
    }

    if (queue2.length > 0 && ticker2.children.length > 0) {
        pos2 -= SPEED2;

        const width2 = getFirstItemWidth(ticker2);
        if (width2 > 0 && -pos2 >= width2) {
            pos2 += width2;
            onQueue2ItemExited();
            if (needsRender) rerenderAll();
        }

        wrapper2.style.transform = `translate3d(${pos2}px,0,0)`;
    }

    if (queue1.length > 0 && ticker1.children.length > 0) {
        pos1 -= SPEED1;

        const width1 = getFirstItemWidth(ticker1);
        if (width1 > 0 && -pos1 >= width1) {
            pos1 += width1;
            onQueue1ItemExited();
            if (needsRender) rerenderAll();
        }

        wrapper1.style.transform = `translate3d(${pos1}px,0,0)`;
    }
}

/* ---------------- schedulers ---------------- */
setInterval(() => {
    applyPendingUpdatesToQueue3();
    rebuildVisibleSets();
    feedQueue2FromQueue4();
    feedQueue1FromQueue2();

    if (needsRender) {
        rerenderAll();
    }
}, APPLY_UPDATES_MS);

setInterval(() => {
    buildQueue4Batch();
    rebuildVisibleSets();
    feedQueue2FromQueue4();
    feedQueue1FromQueue2();

    if (needsRender) {
        rerenderAll();
    }
}, QUEUE4_BUILD_MS);

    const sample = [
        {symbol:"ADANIENT", ltp:2450, change:10, change_percent:0.4},
        {symbol:"ADANIPORTS", ltp:1609.2, change:27.8, change_percent:1.76},
        {symbol:"APOLLOHOSP", ltp:806.2, change:10.75, change_percent:1.35},
        {symbol:"ASIANPAINT", ltp:3012, change:-12.5, change_percent:-0.41},
        {symbol:"AXISBANK", ltp:1100, change:-12, change_percent:-1.1},
        {symbol:"HDFCBANK", ltp:1647.1, change:13.4, change_percent:0.82},
        {symbol:"ICICIBANK", ltp:1180, change:6, change_percent:0.3},
        {symbol:"INFY", ltp:1520, change:-4, change_percent:-0.2},
        {symbol:"RELIANCE", ltp:2890, change:14, change_percent:0.49},
        {symbol:"SBIN", ltp:820, change:9, change_percent:1.1},
        {symbol:"TCS", ltp:3980, change:-15, change_percent:-0.38},
        {symbol:"WIPRO", ltp:510, change:3, change_percent:0.6},
        {symbol:"TITAN", ltp:3450, change:-9, change_percent:-0.25},
        {symbol:"ULTRACEMCO", ltp:10200, change:22, change_percent:0.21},
        {symbol:"LT", ltp:3650, change:18, change_percent:0.5}
    ];

    const now = Date.now();
    sample.forEach(item => {
        queue3State.set(item.symbol, { ...item, ts: now, ready: true });
    });

    buildQueue4Batch();
    rebuildVisibleSets();
    feedQueue2FromQueue4();
    feedQueue1FromQueue2();
    rerenderAll();
}, 1000);
*/

/* ---------------- start ---------------- */
rerenderAll();
animate();
</script>
</body>
</html>
