<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave 2 Screen Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: 'Teko', sans-serif;
}

.ticker-container {
    width: 100vw;
    height: 120px;
    overflow: hidden;
    position: relative;
    background: #000;
}

.ticker-wrapper {
    position: absolute;
    left: 0;
    top: 0;
    height: 120px;
    display: flex;
    align-items: center;
    width: max-content;

    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    transform-style: preserve-3d;
}

.ticker-track {
    display: flex;
    align-items: center;
    height: 120px;
    width: max-content;
    white-space: nowrap;
}

/* ---------- STOCK CARD UI ---------- */
.stock {
    width: 300px;
    height: 110px;
    margin-right: 70px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;

    color: #fff;
    letter-spacing: 1px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    line-height: 1.05;
}

.symbol {
    font-size: 43px;
    font-weight: 700;
    color: #ffffff;
}

.percent {
    font-size: 34px;
    font-weight: 600;
    text-align: right;
}

.price {
    font-size: 39px;
    font-weight: 600;
    color: #ffffff;
}

.change {
    font-size: 34px;
    font-weight: 600;
    text-align: right;
}

.price,
.percent,
.change {
    font-variant-numeric: tabular-nums;
}

.stock.up .percent,
.stock.up .change {
    color: #00ff00;
}

.stock.down .percent,
.stock.down .change {
    color: #ff2b2b;
}

.stock.flat .percent,
.stock.flat .change {
    color: #ffffff;
}

.loading {
    color: #444;
    font-size: 38px;
    padding-left: 40px;
}
</style>
</head>

<body>

<div class="ticker-container">
    <div id="tickerWrapper" class="ticker-wrapper">
        <div id="tickerA" class="ticker-track">
            <div class="loading">WAITING FOR LIVE DATA...</div>
        </div>
        <div id="tickerB" class="ticker-track"></div>
    </div>
</div>

<script>
/* ======================================================
   2 SCREEN CONFIG
====================================================== */

const LEFT_WIDTH = 2176;
const RIGHT_WIDTH = 2048;
const TOTAL_WIDTH = 4224;

const params = new URLSearchParams(window.location.search);
const SCREEN = params.get("screen") || "1";

/*
    screen=1 shows first 2176px
    screen=2 shows next 2048px
*/
const SCREEN_OFFSET = SCREEN === "2" ? LEFT_WIDTH : 0;

/*
    LED speed.
    Try 60, 70, 80, 90.
*/
const SPEED_PX_PER_SECOND = 80;

/*
    How often pending updates are allowed to visually apply.
    Bigger = smoother during market open.
*/
const MIN_REBUILD_GAP_MS = 1200;

/* ======================================================
   STATE
====================================================== */

const socket = io();

const latestStockMap = new Map();
const pendingUpdateMap = new Map();

let tickerSequence = [];

let trackWidth = 1;
let isReady = false;
let lastTimestamp = null;
let scrollX = 0;
let lastRebuildTime = 0;

const tickerWrapper = document.getElementById("tickerWrapper");
const tickerA = document.getElementById("tickerA");
const tickerB = document.getElementById("tickerB");

/* ======================================================
   SOCKET EVENTS
====================================================== */

socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

socket.on("sync_time", (data) => {
    // optional; backend already sends this
    console.log("⏱ sync_time", data);
});

/*
    Your current backend sends stock_update.
    We DO NOT update visible DOM immediately.
    We only store data first.
*/
socket.on("stock_update", (data) => {
    const stock = normalizeStock(data);

    if (!stock.symbol) return;

    latestStockMap.set(stock.symbol, stock);
    pendingUpdateMap.set(stock.symbol, stock);

    if (!isReady && latestStockMap.size >= 5) {
        initializeTicker();
    }
});

/* ======================================================
   DATA NORMALIZE
====================================================== */

function normalizeStock(data) {
    return {
        symbol: String(data.symbol || "").trim(),
        ltp: Number(data.ltp || 0),
        change: Number(data.change || 0),
        change_percent: Number(data.change_percent || 0)
    };
}

/* ======================================================
   INITIALIZE
====================================================== */

function initializeTicker() {
    tickerSequence = Array.from(latestStockMap.keys()).sort();

    buildTicker();

    requestAnimationFrame(() => {
        trackWidth = tickerA.scrollWidth || 1;
        isReady = true;
        console.log("✅ Ticker ready", {
            screen: SCREEN,
            symbols: tickerSequence.length,
            width: trackWidth
        });
    });
}

/* ======================================================
   STOCK CARD UI
====================================================== */

function createStockCard(stock) {
    const isUp = stock.change > 0;
    const isDown = stock.change < 0;

    const cls = isUp ? "up" : isDown ? "down" : "flat";
    const arrow = isUp ? "▲" : isDown ? "▼" : "●";
    const percentSign = stock.change_percent > 0 ? "+" : "";

    return `
        <div class="stock ${cls}" data-symbol="${stock.symbol}">
            <div class="row top">
                <span class="symbol">${stock.symbol}</span>
                <span class="percent">${percentSign}${stock.change_percent.toFixed(2)}%</span>
            </div>

            <div class="row bottom">
                <span class="price">${stock.ltp.toFixed(2)}</span>
                <span class="change">${arrow} ${Math.abs(stock.change).toFixed(2)}</span>
            </div>
        </div>
    `;
}

/* ======================================================
   BUILD TICKER
====================================================== */

function buildTicker() {
    if (tickerSequence.length === 0) return;

    const html = tickerSequence.map(symbol => {
        const stock = latestStockMap.get(symbol);
        if (!stock) return "";
        return createStockCard(stock);
    }).join("");

    tickerA.innerHTML = html;
    tickerB.innerHTML = html;

    requestAnimationFrame(() => {
        trackWidth = tickerA.scrollWidth || 1;
    });
}

/* ======================================================
   SAFE UPDATE LOGIC
====================================================== */

function applyPendingUpdatesSafely() {
    const now = performance.now();

    if (pendingUpdateMap.size === 0) return;
    if (now - lastRebuildTime < MIN_REBUILD_GAP_MS) return;

    pendingUpdateMap.forEach((stock, symbol) => {
        latestStockMap.set(symbol, stock);
    });

    pendingUpdateMap.clear();

    /*
        Important:
        We keep tickerSequence same.
        No random reorder during scroll.
    */
    buildTicker();

    lastRebuildTime = now;
}

/* ======================================================
   SMOOTH SCROLL ENGINE
====================================================== */

function animate(timestamp) {
    requestAnimationFrame(animate);

    if (!isReady || trackWidth <= 1) return;

    if (lastTimestamp === null) {
        lastTimestamp = timestamp;
        return;
    }

    const delta = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    scrollX += SPEED_PX_PER_SECOND * delta;

    if (scrollX >= trackWidth) {
        scrollX = scrollX % trackWidth;
        applyPendingUpdatesSafely();
    }

    /*
        Same ticker, different crop position.
        Screen 1 = offset 0
        Screen 2 = offset 2176
    */
    const x = -(scrollX + SCREEN_OFFSET);

    tickerWrapper.style.transform = `translate3d(${x}px, 0, 0)`;
}

requestAnimationFrame(animate);

/* ======================================================
   FALLBACK
   If only 1-4 stocks arrive initially, still start after 3 sec.
====================================================== */

setTimeout(() => {
    if (!isReady && latestStockMap.size > 0) {
        initializeTicker();
    }
}, 3000);

</script>

</body>
</html>
