<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave LED Smooth Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<!-- ⚠️ Use system font for HDPlayer smoothness -->
<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: 'Teko', sans-serif;
}

/* CONTAINER */
.ticker-container {
    width: 100vw;
    height: 120px;
    overflow: hidden;
}

/* 🔥 CSS SMOOTH SCROLL (MAIN FIX) */
@keyframes tickerScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

.ticker-wrapper {
    display: flex;
    width: max-content;

    animation: tickerScroll 120s linear infinite;

    will-change: transform;
    transform: translate3d(0,0,0);
}

/* TRACK */
.ticker-track {
    display: flex;
}

/* STOCK CARD */
.stock {
    width: 400px;
    height: 110px;
    margin-right: 40px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;

    font-variant-numeric: tabular-nums;
}

/* DEBUG LINE */
.split-line {
    position: fixed;
    top: 0;
    left: 2176px;
    width: 3px;
    height: 120px;
    background: red;
    z-index: 9999;
}

/* ROW */
.row {
    display: grid;
    grid-template-columns: 240px 150px;
    align-items: center;
    white-space: nowrap;   /* 🔥 prevents line break */
}

/* TEXT */
.symbol { 
     font-size: 38px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.percent {
    font-size: 38px;
    font-weight: bold; 
    text-align: right; 
}
.price { 
    font-size: 38px;
    font-weight: bold; 
}
.change {
    font-size: 38px;
    font-weight: bold;
    text-align: right;
}



/* FULL COLOR */
.stock.up, .stock.up * { color: #00ff00; }
.stock.down, .stock.down * { color: #ff2b2b; }
.stock.flat, .stock.flat * { color: #ffffff; }

</style>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>

<body>

<div class="split-line"></div>

<div class="ticker-container">
    <div id="wrapper" class="ticker-wrapper">
        <div id="track1" class="ticker-track"></div>
        <div id="track2" class="ticker-track"></div>
    </div>
</div>

<script>
const socket = io();

const latest = new Map();
const cards = new Map();

let sequence = [];
let started = false;

/* RECEIVE DATA */
socket.on("stock_update", data => {
    const s = {
        symbol: data.symbol,
        ltp: +data.ltp,
        change: +data.change,
        pct: +data.change_percent
    };

    latest.set(s.symbol, s);

    if (!started && latest.size >= 40) {
        startTicker();
    }

    updateCard(s);
});

/* START */
function startTicker() {
    sequence = Array.from(latest.keys()).sort();

    const html = sequence.map(sym => renderCard(latest.get(sym))).join("");

    document.getElementById("track1").innerHTML = html;
    document.getElementById("track2").innerHTML = html;

    mapCards();
    started = true;
}

/* CARD */
function renderCard(s) {
    const dir = s.change > 0 ? "up" : s.change < 0 ? "down" : "flat";
    const arrow = s.change > 0 ? "▲" : s.change < 0 ? "▼" : "●";
    const sign = s.pct > 0 ? "+" : "";

    return `
    <div class="stock ${dir}" data-s="${s.symbol}">
        <div class="row">
            <div class="symbol">${s.symbol}</div>
            <div class="percent">${sign}${s.pct.toFixed(2)}%</div>
        </div>
        <div class="row">
            <div class="price">${s.ltp.toFixed(2)}</div>
            <div class="change">${arrow} ${Math.abs(s.change).toFixed(2)}</div>
        </div>
    </div>`;
}

/* MAP */
function mapCards() {
    cards.clear();

    document.querySelectorAll(".stock").forEach(el => {
        const s = el.dataset.s;
        if (!cards.has(s)) cards.set(s, []);
        cards.get(s).push(el);
    });
}

/* REALTIME UPDATE */
function updateCard(s) {
    const list = cards.get(s.symbol);
    if (!list) return;

    const dir = s.change > 0 ? "up" : s.change < 0 ? "down" : "flat";
    const arrow = s.change > 0 ? "▲" : s.change < 0 ? "▼" : "●";
    const sign = s.pct > 0 ? "+" : "";

    list.forEach(el => {
        el.className = `stock ${dir}`;
        el.querySelector(".percent").textContent = `${sign}${s.pct.toFixed(2)}%`;
        el.querySelector(".price").textContent = s.ltp.toFixed(2);
        el.querySelector(".change").textContent = `${arrow} ${Math.abs(s.change).toFixed(2)}`;
    });
}
</script>

</body>
</html>
