<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.page {
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding-top: 2px;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    position: relative;
}

.list1-row {
    width: 2176px;
    height: 120px;
}

.list2-row {
    width: 2048px;
    height: 120px;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0, 0, 0);
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    min-width: 200%;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
    flex-shrink: 0;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
    white-space: nowrap;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;
}

.arrow {
    margin-right: 2px;
}

.up { color: lime; }
.down { color: red; }

.list2-row {
    border-top: 1px solid rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<div class="page">
    <div class="ticker-row list1-row">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
            <div class="ticker" id="ticker1-clone"></div>
        </div>
    </div>

    <div class="ticker-row list2-row">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
            <div class="ticker" id="ticker2-clone"></div>
        </div>
    </div>
</div>

<script>
console.log("SCRIPT LOADED");

const socket = io();

const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const ticker1 = document.getElementById("ticker1");
const ticker1Clone = document.getElementById("ticker1-clone");

const ticker2 = document.getElementById("ticker2");
const ticker2Clone = document.getElementById("ticker2-clone");

/* ---------------- state ---------------- */
let list1 = [];   // visible top row
let list2 = [];   // visible second row
let list3 = [];   // storage only

const pendingUpdates = {};

const TARGET_LIST2 = 18;
const TARGET_LIST1 = 18;

const SPEED1 = 1.8;
const SPEED2 = 1.8;

let pos1 = 0;
let pos2 = 0;

let needsRender = true;

/* ---------------- socket ---------------- */
socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

socket.on("connect_error", (err) => {
    console.error("❌ connect_error:", err);
});

socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- helpers ---------------- */
function formatSignedNumber(value) {
    return value >= 0 ? `+${value}` : `${value}`;
}

function makeStockHTML(data) {
    const colorClass = data.change < 0 ? "down" : "up";
    const arrow = data.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock" data-symbol="${data.symbol}">
            <div class="stock-text">
                <div>
                    <div class="symbol-ltp ${colorClass}">${data.symbol}</div>
                    <div class="symbol-ltp ${colorClass}">${data.ltp}</div>
                </div>

                <div class="change-arrow ${colorClass}" style="flex-direction: column; align-items: flex-end;">
                    <div>(${data.change_percent}%)</div>
                    <div>
                        <span class="arrow">${arrow}</span>
                        <span>${formatSignedNumber(data.change)}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function renderList(list, container, cloneContainer) {
    const html = list.map(makeStockHTML).join("");
    container.innerHTML = html;
    cloneContainer.innerHTML = html;
}

function rerenderAll() {
    renderList(list1, ticker1, ticker1Clone);
    renderList(list2, ticker2, ticker2Clone);

    if (list1.length === 0) {
        pos1 = 0;
        wrapper1.style.transform = "translate3d(0,0,0)";
    }
    if (list2.length === 0) {
        pos2 = 0;
        wrapper2.style.transform = "translate3d(0,0,0)";
    }

    needsRender = false;
}

function findSymbolIndex(list, symbol) {
    return list.findIndex(item => item.symbol === symbol);
}

function updateIfExists(list, data) {
    const idx = findSymbolIndex(list, data.symbol);
    if (idx !== -1) {
        list[idx] = { ...list[idx], ...data };
        needsRender = true;
        return true;
    }
    return false;
}

function existsAnywhere(symbol) {
    return (
        findSymbolIndex(list1, symbol) !== -1 ||
        findSymbolIndex(list2, symbol) !== -1 ||
        findSymbolIndex(list3, symbol) !== -1
    );
}

function insertSortedIntoList3(data) {
    list3.push({ ...data });
    list3.sort((a, b) => a.symbol.localeCompare(b.symbol));
    needsRender = true;
}

function removeFromList(list, symbol) {
    const idx = findSymbolIndex(list, symbol);
    if (idx !== -1) {
        const [item] = list.splice(idx, 1);
        needsRender = true;
        return item;
    }
    return null;
}

function getFirstItemWidth(tickerEl) {
    const first = tickerEl.children[0];
    if (!first) return 0;

    const style = getComputedStyle(first);
    return first.offsetWidth + parseFloat(style.marginRight || 0);
}

/* ---------------- incoming data ---------------- */
function handleIncomingTick(data) {
    const updated =
        updateIfExists(list1, data) ||
        updateIfExists(list2, data) ||
        updateIfExists(list3, data);

    if (!updated && !existsAnywhere(data.symbol)) {
        insertSortedIntoList3(data);
    }
}

/* ---------------- filling logic ---------------- */
function fillList2FromList3() {
    while (list2.length < TARGET_LIST2 && list3.length > 0) {
        list2.push(list3.shift());
        needsRender = true;
    }
}

function fillList1FromList2() {
    while (list1.length < TARGET_LIST1 && list2.length > 0) {
        list1.push(list2.shift());
        needsRender = true;
    }
}

function seedRows() {
    fillList2FromList3();
    fillList1FromList2();
}

function topUpAll() {
    fillList2FromList3();
    fillList1FromList2();
}

/* ---------------- handoff logic ----------------
   Rule:
   - when first item fully exits List2, move it immediately to end of List1
   - when first item fully exits List1, move it back into sorted List3
*/
function onList2ItemExited() {
    if (list2.length === 0) return;

    const exited = list2.shift();
    list1.push(exited);
    needsRender = true;

    if (list3.length > 0) {
        list2.push(list3.shift());
        needsRender = true;
    }
}

function onList1ItemExited() {
    if (list1.length === 0) return;

    const exited = list1.shift();
    insertSortedIntoList3(exited);

    if (list2.length > 0) {
        list1.push(list2.shift());
        needsRender = true;

        if (list3.length > 0) {
            list2.push(list3.shift());
            needsRender = true;
        }
    }
}

/* ---------------- animation ---------------- */
function animate() {
    requestAnimationFrame(animate);

    if (needsRender) {
        rerenderAll();
    }

    if (list2.length > 0 && ticker2.children.length > 0) {
        pos2 -= SPEED2;

        const width2 = getFirstItemWidth(ticker2);
        if (width2 > 0 && -pos2 >= width2) {
            pos2 += width2;
            onList2ItemExited();
            if (needsRender) rerenderAll();
        }

        wrapper2.style.transform = `translate3d(${pos2}px,0,0)`;
    }

    if (list1.length > 0 && ticker1.children.length > 0) {
        pos1 -= SPEED1;

        const width1 = getFirstItemWidth(ticker1);
        if (width1 > 0 && -pos1 >= width1) {
            pos1 += width1;
            onList1ItemExited();
            if (needsRender) rerenderAll();
        }

        wrapper1.style.transform = `translate3d(${pos1}px,0,0)`;
    }
}

/* ---------------- apply backend updates ---------------- */
setInterval(() => {
    const symbols = Object.keys(pendingUpdates);
    if (symbols.length === 0) return;

    for (const symbol of symbols) {
        handleIncomingTick(pendingUpdates[symbol]);
        delete pendingUpdates[symbol];
    }

    topUpAll();

    if (needsRender) {
        rerenderAll();
    }
}, 200);

/* ---------------- startup safety ---------------- */
setInterval(() => {
    topUpAll();
    if (needsRender) {
        rerenderAll();
    }
}, 1500);

        {symbol:"HDFCBANK", ltp:1647.1, change:13.4, change_percent:0.82},
        {symbol:"ICICIBANK", ltp:1180, change:6, change_percent:0.3},
        {symbol:"INFY", ltp:1520, change:-4, change_percent:-0.2},
        {symbol:"RELIANCE", ltp:2890, change:14, change_percent:0.49},
        {symbol:"SBIN", ltp:820, change:9, change_percent:1.1},

        {symbol:"LT", ltp:3650, change:18, change_percent:0.5}
    ];

    sample.forEach(handleIncomingTick);
    seedRows();
    rerenderAll();
}, 1000);
*/

/* ---------------- start ---------------- */
seedRows();
rerenderAll();
animate();
</script>

</body>
</html>
