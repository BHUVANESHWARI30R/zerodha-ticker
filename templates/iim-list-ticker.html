<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

body {
    line-height: 1;
}

.page {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    position: relative;
    margin: 0;
    padding: 0;
}

.list1-row {
    width: 2176px;   /* LEFT SCREEN */
    height: 128px;
}

.list2-row {
    width: 2048px;   /* RIGHT SCREEN */
    height: 128px;
    border-top: none;
}

.ticker-wrapper {
    display: flex;
    width: 100%;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    margin: 0;
    padding: 0;
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    width: 100%;
    flex-shrink: 0;
    margin: 0;
    padding: 0;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
    flex-shrink: 0;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
    white-space: nowrap;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;
}

.arrow {
    margin-right: 2px;
}

.up { color: lime; }
.down { color: red; }

#measureBox {
    position: absolute;
    visibility: hidden;
    left: -99999px;
    top: -99999px;
    white-space: nowrap;
    pointer-events: none;
    margin: 0;
    padding: 0;
}
</style>
</head>

<body>

<div class="page">
    <div class="ticker-row list1-row">
        <div class="ticker-wrapper">
            <div class="ticker" id="ticker1"></div>
        </div>
    </div>

    <div class="ticker-row list2-row">
        <div class="ticker-wrapper">
            <div class="ticker" id="ticker2"></div>
        </div>
    </div>
</div>

<div id="measureBox"></div>

<script>
console.log("SMOOTH ENGINE LOADED");

const socket = io();

const wrapper1 = document.querySelector(".list1-row .ticker-wrapper");
const wrapper2 = document.querySelector(".list2-row .ticker-wrapper");

const ticker1 = document.getElementById("ticker1");
const ticker2 = document.getElementById("ticker2");

/* ---------------- FIX WIDTH ---------------- */
const LEFT_SCREEN_WIDTH = 2176;

/* ---------------- DATA ---------------- */
let displayQueue = [];
let pendingUpdates = {};
let queue3State = new Map();

/* ---------------- SCROLL ENGINE ---------------- */
let globalX = 0;
let cycleWidth = 0;
let lastTime = performance.now();

const SPEED = 1.4; // 🔧 smooth speed

/* ---------------- SOCKET ---------------- */
socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- UI ---------------- */
function formatSignedNumber(value) {
    return value >= 0 ? `+${value}` : value;
}

function makeStockHTML(data) {
    const colorClass = data.change < 0 ? "down" : "up";
    const arrow = data.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock">
            <div class="stock-text">
                <div>
                    <div class="symbol-ltp ${colorClass}">${data.symbol}</div>
                    <div class="symbol-ltp ${colorClass}">${data.ltp}</div>
                </div>

                <div class="change-arrow ${colorClass}" style="flex-direction: column; align-items: flex-end;">
                    <div>(${data.change_percent}%)</div>
                    <div>
                        <span class="arrow">${arrow}</span>
                        <span>${formatSignedNumber(data.change)}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
}

/* ---------------- RENDER (ONCE) ---------------- */
function renderTicker() {
    if (displayQueue.length === 0) return;

    const html = displayQueue.map(makeStockHTML).join("");

    ticker1.innerHTML = html + html; // duplicate for loop
    ticker2.innerHTML = html + html;

    cycleWidth = ticker1.scrollWidth / 2; // important
}

/* ---------------- SMOOTH SCROLL ---------------- */
function animate(now) {
    requestAnimationFrame(animate);

    if (!cycleWidth) return;

    const delta = now - lastTime;
    lastTime = now;

    globalX += SPEED * (delta / 16.67);

    if (globalX >= cycleWidth) {
        globalX -= cycleWidth;
    }

    const leftOffset = globalX;
    const rightOffset = globalX + LEFT_SCREEN_WIDTH;

    wrapper1.style.transform = `translate3d(${-leftOffset}px,0,0)`;
    wrapper2.style.transform = `translate3d(${-rightOffset}px,0,0)`;
}

/* ---------------- UPDATE QUEUE ---------------- */
setInterval(() => {
    const symbols = Object.keys(pendingUpdates);
    if (!symbols.length) return;

    const now = Date.now();

    for (const symbol of symbols) {
        const data = pendingUpdates[symbol];

        queue3State.set(symbol, {
            ...data,
            ts: now
        });

        delete pendingUpdates[symbol];
    }

    // rebuild sorted queue4
    const nextQueue = [];

    for (const [symbol, data] of queue3State.entries()) {
        nextQueue.push(data);
    }

    nextQueue.sort((a, b) => a.symbol.localeCompare(b.symbol));

    displayQueue = nextQueue;

    renderTicker(); // 🔥 only here

}, 300);

/* ---------------- TEST DATA (REMOVE LATER) ---------------- */
setTimeout(() => {
    displayQueue = [
        {symbol:"RELIANCE", ltp:2890, change:10, change_percent:0.4},
        {symbol:"TCS", ltp:3980, change:-5, change_percent:-0.2},
        {symbol:"INFY", ltp:1520, change:4, change_percent:0.3},
        {symbol:"HDFCBANK", ltp:1647, change:6, change_percent:0.2},
        {symbol:"SBIN", ltp:820, change:3, change_percent:0.1},
        {symbol:"ITC", ltp:450, change:-2, change_percent:-0.4},
        {symbol:"LT", ltp:3650, change:8, change_percent:0.5}
    ];
    renderTicker();
}, 500);

/* ---------------- START ---------------- */
animate();
</script>
</body>
</html>
