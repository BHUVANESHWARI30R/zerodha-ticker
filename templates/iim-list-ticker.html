<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.page {
    margin-top: 2px;
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding-top: 2px;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    position: relative;
}

.list1-row {
    width: 2176px;   /* LEFT SCREEN */
    height: 128px;
}

.list2-row {
    width: 2048px;   /* RIGHT SCREEN */
    height: 128px;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0, 0, 0);
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    flex-shrink: 0;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
    flex-shrink: 0;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
    white-space: nowrap;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;
}

.arrow {
    margin-right: 2px;
}

.up { color: lime; }
.down { color: red; }

.list2-row {
    border-top: 1px solid rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<div class="page">
    <!-- ROW 1 = LEFT SCREEN -->
    <div class="ticker-row list1-row">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
            <div class="ticker" id="ticker1-clone"></div>
        </div>
    </div>

    <!-- ROW 2 = RIGHT SCREEN -->
    <div class="ticker-row list2-row">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
            <div class="ticker" id="ticker2-clone"></div>
        </div>
    </div>
</div>



<script>
console.log("SCRIPT LOADED");

const socket = io();

const wrapper1 = document.getElementById("wrapper1"); // LEFT
const wrapper2 = document.getElementById("wrapper2"); // RIGHT

const ticker1 = document.getElementById("ticker1");
const ticker1Clone = document.getElementById("ticker1-clone");

const ticker2 = document.getElementById("ticker2");
const ticker2Clone = document.getElementById("ticker2-clone");

/* =========================================================
   SCREEN MODEL
   row1 = LEFT screen
   row2 = RIGHT screen

   DATA MODEL
   queue3State = realtime latest stock state
   queue4      = sorted fresh display-ready queue
   displayQueue = single continuous stream for BOTH screens
========================================================= */

const LEFT_SCREEN_WIDTH = 2176;
const RIGHT_SCREEN_WIDTH = 2048;

const queue3State = new Map();   // symbol -> latest payload + timestamp
let queue4 = [];                 // sorted fresh batch
let displayQueue = [];           // one shared stream

const pendingUpdates = {};

const FRESH_MS = 15000;
const APPLY_UPDATES_MS = 200;
const BUILD_QUEUE4_MS = 1000;

//UPDATED SPEED 
const SPEED = 3.0;

let globalX = 0;
let cycleWidth = 0;
let needsRender = true;

const MASTER_SYMBOLS = [
    "ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO",
    "BAJFINANCE","BAJAJFINSV","BEL","BHARTIARTL","CIPLA","COALINDIA",
    "DRREDDY","EICHERMOT","GRASIM","HCLTECH","HDFCBANK","HDFCLIFE",
    "HINDALCO","HINDUNILVR","ICICIBANK","INDUSINDBK","INDIGO","INFY","ITC",
    "JIOFIN","JSWSTEEL","KOTAKBANK","LT","M&M","MARUTI","MAXHEALTH",
    "NESTLEIND","NTPC","ONGC","POWERGRID","RELIANCE","SBILIFE","SBIN",
    "SHRIRAMFIN","SUNPHARMA","TATACONSUM","TATAMOTORS","TATASTEEL","TCS",
    "TECHM","TITAN","TRENT","ULTRACEMCO","WIPRO"
].sort();

/* ---------------- socket events ---------------- */
socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

socket.on("connect_error", (err) => {
    console.error("❌ connect_error:", err);
});

socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- helpers ---------------- */
function formatSignedNumber(value) {
    return value >= 0 ? `+${value}` : `${value}`;
}

function makeStockHTML(data) {
    const colorClass = data.change < 0 ? "down" : "up";
    const arrow = data.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock" data-symbol="${data.symbol}">
            <div class="stock-text">
                <div>
                    <div class="symbol-ltp ${colorClass}">${data.symbol}</div>
                    <div class="symbol-ltp ${colorClass}">${data.ltp}</div>
                </div>

                <div class="change-arrow ${colorClass}" style="flex-direction: column; align-items: flex-end;">
                    <div>(${data.change_percent}%)</div>
                    <div>
                        <span class="arrow">${arrow}</span>
                        <span>${formatSignedNumber(data.change)}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function isFresh(entry) {
    if (!entry || !entry.ts) return false;
    return (Date.now() - entry.ts) <= FRESH_MS;
}

function queuesEqual(a, b) {
    if (a.length !== b.length) return false;

    for (let i = 0; i < a.length; i++) {
        if (a[i].symbol !== b[i].symbol) return false;
        if (a[i].ltp !== b[i].ltp) return false;
        if (a[i].change !== b[i].change) return false;
        if (a[i].change_percent !== b[i].change_percent) return false;
    }
    return true;
}

/* ---------------- queue3 realtime state ---------------- */
function applyPendingUpdatesToQueue3() {
    const symbols = Object.keys(pendingUpdates);
    if (symbols.length === 0) return;

    const now = Date.now();

    for (const symbol of symbols) {
        const data = pendingUpdates[symbol];

        queue3State.set(symbol, {
            ...data,
            ts: now,
            ready: true
        });

        delete pendingUpdates[symbol];
    }
}

/* ---------------- queue4 sorted fresh display queue ---------------- */
function rebuildQueue4() {
    const nextQueue4 = [];

    for (const symbol of MASTER_SYMBOLS) {
        const entry = queue3State.get(symbol);
        if (!isFresh(entry)) continue;
        nextQueue4.push({ ...entry });
    }

    if (!queuesEqual(queue4, nextQueue4)) {
        queue4 = nextQueue4;
        displayQueue = nextQueue4;
        needsRender = true;
    }
}

/* ---------------- rendering ---------------- */
function renderSharedStream() {
    if (displayQueue.length === 0) {
        ticker1.innerHTML = "";
        ticker1Clone.innerHTML = "";
        ticker2.innerHTML = "";
        ticker2Clone.innerHTML = "";
        cycleWidth = 0;
        wrapper1.style.transform = "translate3d(0,0,0)";
        wrapper2.style.transform = "translate3d(0,0,0)";
        needsRender = false;
        return;
    }

    const streamHTML = displayQueue.map(makeStockHTML).join("");

    /* same exact stream for both screens */
    ticker1.innerHTML = streamHTML;
    ticker1Clone.innerHTML = streamHTML;

    ticker2.innerHTML = streamHTML;
    ticker2Clone.innerHTML = streamHTML;

    /* width of ONE full stream copy */
    cycleWidth = ticker1.scrollWidth;

    needsRender = false;
}

/* ---------------- sync transforms ----------------
   row1 shows left screen segment
   row2 shows continuation after left screen width
*/
function applyTransforms() {
    if (!cycleWidth || displayQueue.length === 0) return;

    const leftOffset = globalX % cycleWidth;
    const rightOffset = (globalX + LEFT_SCREEN_WIDTH) % cycleWidth;

    wrapper1.style.transform = `translate3d(${-leftOffset}px, 0, 0)`;
    wrapper2.style.transform = `translate3d(${-rightOffset}px, 0, 0)`;
}

/* ---------------- animation ---------------- */
function animate() {
    requestAnimationFrame(animate);

    if (needsRender) {
        renderSharedStream();
        applyTransforms();
    }

    if (!cycleWidth || displayQueue.length === 0) return;

    globalX += SPEED;

    if (globalX >= cycleWidth) {
        globalX -= cycleWidth;
    }

    applyTransforms();
}

/* ---------------- schedulers ---------------- */
setInterval(() => {
    applyPendingUpdatesToQueue3();
    rebuildQueue4();

    if (needsRender) {
        renderSharedStream();
        applyTransforms();
    }
}, APPLY_UPDATES_MS);

setInterval(() => {
    rebuildQueue4();

    if (needsRender) {
        renderSharedStream();
        applyTransforms();
    }
}, BUILD_QUEUE4_MS);

*/

/* ---------------- start ---------------- */
renderSharedStream();
applyTransforms();
animate();
</script>

</body>
</html>
