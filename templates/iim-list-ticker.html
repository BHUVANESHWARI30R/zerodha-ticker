<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.page {
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding-top: 2px;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    position: relative;
}

.list1-row {
    width: 2176px;
    height: 120px;
}

.list2-row {
    width: 2048px;
    height: 120px;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0, 0, 0);
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    flex-shrink: 0;
}

.stock-inline {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    margin-right: 34px;
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.2px;
}

.stock-symbol {
    margin-right: 14px;
}

.stock-ltp {
    margin-right: 14px;
}

.stock-percent {
    margin-right: 10px;
}

.stock-change {
    display: inline-flex;
    align-items: center;
}

.separator {
    display: inline-flex;
    align-items: center;
    margin-right: 34px;
    font-size: 42px;
    line-height: 1;
    color: rgba(255,255,255,0.55);
}

.up {
    color: lime;
}

.down {
    color: red;
}

.list2-row {
    border-top: 1px solid rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<div class="page">
    <div class="ticker-row list1-row">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
            <div class="ticker" id="ticker1-clone"></div>
        </div>
    </div>

    <div class="ticker-row list2-row">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
            <div class="ticker" id="ticker2-clone"></div>
        </div>
    </div>
</div>

<script>
console.log("SCRIPT LOADED");

const socket = io();

const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const ticker1 = document.getElementById("ticker1");
const ticker1Clone = document.getElementById("ticker1-clone");

const ticker2 = document.getElementById("ticker2");
const ticker2Clone = document.getElementById("ticker2-clone");

/*
  list1 = visible top ribbon
  list2 = visible second ribbon
  list3 = storage only
*/
let list1 = [];
let list2 = [];
let list3 = [];

const pendingUpdates = {};

const MAX_LIST1 = 10;
const MAX_LIST2 = 10;

const SPEED1 = 1.4;
const SPEED2 = 1.4;

let pos1 = 0;
let pos2 = 0;

/* ---------------- socket ---------------- */
socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

socket.on("connect_error", (err) => {
    console.error("❌ connect_error:", err);
});

socket.on("stock_update", (data) => {
    console.log("📥 Received:", data);
    pendingUpdates[data.symbol] = data;
});

/* ---------------- helpers ---------------- */
function formatSignedNumber(value) {
    return value >= 0 ? `+${value}` : `${value}`;
}

function formatPercent(value) {
    return `(${value >= 0 ? '+' : ''}${value}%)`;
}

function makeStockHTML(data) {
    const colorClass = data.change < 0 ? "down" : "up";
    const arrow = data.change >= 0 ? "▲" : "▼";

    return `
        <span class="stock-inline ${colorClass}" data-symbol="${data.symbol}">
            <span class="stock-symbol">${data.symbol}</span>
            <span class="stock-ltp">${data.ltp}</span>
            <span class="stock-percent">${formatPercent(data.change_percent)}</span>
            <span class="stock-change">${arrow}&nbsp;${formatSignedNumber(data.change)}</span>
        </span>
        <span class="separator">•</span>
    `;
}

function renderList(list, container, cloneContainer) {
    const html = list.map(makeStockHTML).join("");
    container.innerHTML = html;
    cloneContainer.innerHTML = html;
}

function rerenderAll() {
    renderList(list1, ticker1, ticker1Clone);
    renderList(list2, ticker2, ticker2Clone);

    if (list1.length === 0) {
        pos1 = 0;
        wrapper1.style.transform = "translate3d(0,0,0)";
    }

    if (list2.length === 0) {
        pos2 = 0;
        wrapper2.style.transform = "translate3d(0,0,0)";
    }
}

function findSymbolIndex(list, symbol) {
    return list.findIndex(item => item.symbol === symbol);
}

function updateIfExists(list, data) {
    const idx = findSymbolIndex(list, data.symbol);
    if (idx !== -1) {
        list[idx] = { ...list[idx], ...data };
        return true;
    }
    return false;
}

function existsAnywhere(symbol) {
    return (
        findSymbolIndex(list1, symbol) !== -1 ||
        findSymbolIndex(list2, symbol) !== -1 ||
        findSymbolIndex(list3, symbol) !== -1
    );
}

function insertSorted(list, data) {
    list.push({ ...data });
    list.sort((a, b) => a.symbol.localeCompare(b.symbol));
}

/* ---------------- incoming tick handling ---------------- */
function handleIncomingTick(data) {
    const updated =
        updateIfExists(list1, data) ||
        updateIfExists(list2, data) ||
        updateIfExists(list3, data);

    if (!updated && !existsAnywhere(data.symbol)) {
        insertSorted(list3, data);
    }
}

/* ---------------- pipeline movement ---------------- */
function moveList3ToList2() {
    if (list2.length >= MAX_LIST2) return;
    if (list3.length === 0) return;

    const item = list3.shift();
    list2.push(item);
}

function moveList2ToList1() {
    if (list1.length >= MAX_LIST1) return;
    if (list2.length === 0) return;

    const item = list2.shift();
    list1.push(item);
}

function recycleFromList1() {
    if (list1.length === 0) return;

    const item = list1.shift();
    insertSorted(list3, item);
}

function balancePipeline() {
    while (list2.length < MAX_LIST2 && list3.length > 0) {
        moveList3ToList2();
    }

    while (list1.length < MAX_LIST1 && list2.length > 0) {
        moveList2ToList1();
    }
}

/* ---------------- scroll logic ----------------
   Move based on the first stock-inline width + separator width.
*/
function getLeadUnitWidth(tickerEl) {
    const firstStock = tickerEl.querySelector(".stock-inline");
    const firstSep = tickerEl.querySelector(".separator");

    if (!firstStock) return 0;

    const stockWidth = firstStock.offsetWidth;
    const sepWidth = firstSep ? firstSep.offsetWidth : 0;

    const stockStyle = getComputedStyle(firstStock);
    const sepStyle = firstSep ? getComputedStyle(firstSep) : null;

    const stockMargin = parseFloat(stockStyle.marginRight || 0);
    const sepMargin = sepStyle ? parseFloat(sepStyle.marginRight || 0) : 0;

    return stockWidth + stockMargin + sepWidth + sepMargin;
}

function animate() {
    requestAnimationFrame(animate);

    if (list1.length > 0 && ticker1.children.length > 0) {
        pos1 -= SPEED1;

        const leadWidth1 = getLeadUnitWidth(ticker1);
        if (leadWidth1 > 0 && -pos1 >= leadWidth1) {
            pos1 += leadWidth1;
            recycleFromList1();
            balancePipeline();
            rerenderAll();
        }

        wrapper1.style.transform = `translate3d(${pos1}px,0,0)`;
    }

    if (list2.length > 0 && ticker2.children.length > 0) {
        pos2 -= SPEED2;

        const leadWidth2 = getLeadUnitWidth(ticker2);
        if (leadWidth2 > 0 && -pos2 >= leadWidth2) {
            pos2 += leadWidth2;
            moveList2ToList1();
            balancePipeline();
            rerenderAll();
        }

        wrapper2.style.transform = `translate3d(${pos2}px,0,0)`;
    }
}

/* ---------------- apply updates ---------------- */
setInterval(() => {
    const symbols = Object.keys(pendingUpdates);
    if (symbols.length === 0) return;

    for (const symbol of symbols) {
        handleIncomingTick(pendingUpdates[symbol]);
        delete pendingUpdates[symbol];
    }

    balancePipeline();
    rerenderAll();
}, 250);

/* ---------------- safety refill ---------------- */
setInterval(() => {
    balancePipeline();
    rerenderAll();
}, 1000);

/* ---------------- local test data ----------------
   Uncomment if you want to verify scrolling before backend ticks arrive.

setTimeout(() => {
    [
        {symbol:"ADANIENT", ltp:2450, change:10, change_percent:0.4},
        {symbol:"AXISBANK", ltp:1100, change:-12, change_percent:-1.1},
        {symbol:"HDFCBANK", ltp:1600, change:8, change_percent:0.5},
        {symbol:"ICICIBANK", ltp:1180, change:6, change_percent:0.3},
        {symbol:"INFY", ltp:1520, change:-4, change_percent:-0.2},
        {symbol:"RELIANCE", ltp:2890, change:14, change_percent:0.49},
        {symbol:"SBIN", ltp:820, change:9, change_percent:1.1},
        {symbol:"TCS", ltp:3980, change:-15, change_percent:-0.38},
        {symbol:"WIPRO", ltp:510, change:3, change_percent:0.6},
        {symbol:"TITAN", ltp:3450, change:-9, change_percent:-0.25},
        {symbol:"ULTRACEMCO", ltp:10200, change:22, change_percent:0.21},
        {symbol:"LT", ltp:3650, change:18, change_percent:0.5}
    ].forEach(handleIncomingTick);

    balancePipeline();
    rerenderAll();
}, 1000);
*/

/* start */
rerenderAll();
animate();
</script>

</body>
</html>
