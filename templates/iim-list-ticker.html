<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.page {
    margin-top: 2px;
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding-top: 2px;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    position: relative;
}

.list1-row {
    width: 2176px;   /* LEFT SCREEN */
    height: 128px;
}

.list2-row {
    width: 2048px;   /* RIGHT SCREEN */
    height: 128px;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    flex-shrink: 0;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
    flex-shrink: 0;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
    white-space: nowrap;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;
}

.arrow {
    margin-right: 2px;
}

.up { color: lime; }
.down { color: red; }

.list2-row {
    border-top: 1px solid rgba(255,255,255,0.05);
}

/* hidden measurer */
#measureBox {
    position: absolute;
    visibility: hidden;
    left: -99999px;
    top: -99999px;
    white-space: nowrap;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="page">
    <!-- ROW 1 = LEFT SCREEN -->
    <div class="ticker-row list1-row">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
        </div>
    </div>

    <!-- ROW 2 = RIGHT SCREEN -->
    <div class="ticker-row list2-row">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
        </div>
    </div>
</div>

<div id="measureBox"></div>

<script>
console.log("SCRIPT LOADED");

const socket = io();

const ticker1 = document.getElementById("ticker1"); // LEFT
const ticker2 = document.getElementById("ticker2"); // RIGHT
const measureBox = document.getElementById("measureBox");

/* =========================================================
   SCREEN MODEL
   row1 = LEFT screen
   row2 = RIGHT screen

   DATA MODEL
   queue3State = realtime latest stock state
   queue4      = sorted fresh display-ready queue
   displayQueue = single ordered stock stream
========================================================= */

const LEFT_SCREEN_WIDTH = 2176;
const RIGHT_SCREEN_WIDTH = 2048;

const queue3State = new Map();   // symbol -> latest payload + timestamp
let queue4 = [];
let displayQueue = [];

const pendingUpdates = {};

const FRESH_MS = 15000;
const APPLY_UPDATES_MS = 200;
const BUILD_QUEUE4_MS = 1000;

/*
  STEP MODE:
  - no stock gets cut at the split
  - ticker advances one stock at a time
*/
const STEP_INTERVAL_MS = 700;

let currentHead = 0;
let isRendering = false;

const MASTER_SYMBOLS = [
    "ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO",
    "BAJFINANCE","BAJAJFINSV","BEL","BHARTIARTL","CIPLA","COALINDIA",
    "DRREDDY","EICHERMOT","GRASIM","HCLTECH","HDFCBANK","HDFCLIFE",
    "HINDALCO","HINDUNILVR","ICICIBANK","INDUSINDBK","INDIGO","INFY","ITC",
    "JIOFIN","JSWSTEEL","KOTAKBANK","LT","M&M","MARUTI","MAXHEALTH",
    "NESTLEIND","NTPC","ONGC","POWERGRID","RELIANCE","SBILIFE","SBIN",
    "SHRIRAMFIN","SUNPHARMA","TATACONSUM","TATAMOTORS","TATASTEEL","TCS",
    "TECHM","TITAN","TRENT","ULTRACEMCO","WIPRO"
].sort();

/* ---------------- socket events ---------------- */
socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

socket.on("connect_error", (err) => {
    console.error("❌ connect_error:", err);
});

socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- helpers ---------------- */
function formatSignedNumber(value) {
    return value >= 0 ? `+${value}` : `${value}`;
}

function makeStockHTML(data) {
    const colorClass = data.change < 0 ? "down" : "up";
    const arrow = data.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock" data-symbol="${data.symbol}">
            <div class="stock-text">
                <div>
                    <div class="symbol-ltp ${colorClass}">${data.symbol}</div>
                    <div class="symbol-ltp ${colorClass}">${data.ltp}</div>
                </div>

                <div class="change-arrow ${colorClass}" style="flex-direction: column; align-items: flex-end;">
                    <div>(${data.change_percent}%)</div>
                    <div>
                        <span class="arrow">${arrow}</span>
                        <span>${formatSignedNumber(data.change)}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function isFresh(entry) {
    if (!entry || !entry.ts) return false;
    return (Date.now() - entry.ts) <= FRESH_MS;
}

function queuesEqual(a, b) {
    if (a.length !== b.length) return false;

    for (let i = 0; i < a.length; i++) {
        if (a[i].symbol !== b[i].symbol) return false;
        if (a[i].ltp !== b[i].ltp) return false;
        if (a[i].change !== b[i].change) return false;
        if (a[i].change_percent !== b[i].change_percent) return false;
    }
    return true;
}

function measureStockWidth(item) {
    measureBox.innerHTML = makeStockHTML(item);
    const el = measureBox.firstElementChild;
    if (!el) return 0;
    const style = getComputedStyle(el);
    return el.offsetWidth + parseFloat(style.marginRight || 0);
}

function normalizeHead() {
    if (displayQueue.length === 0) {
        currentHead = 0;
        return;
    }
    currentHead = currentHead % displayQueue.length;
    if (currentHead < 0) currentHead += displayQueue.length;
}

/* ---------------- queue3 realtime state ---------------- */
function applyPendingUpdatesToQueue3() {
    const symbols = Object.keys(pendingUpdates);
    if (symbols.length === 0) return false;

    const now = Date.now();
    let changed = false;

    for (const symbol of symbols) {
        const data = pendingUpdates[symbol];

        queue3State.set(symbol, {
            ...data,
            ts: now,
            ready: true
        });

        delete pendingUpdates[symbol];
        changed = true;
    }

    return changed;
}

/* ---------------- queue4 sorted fresh display queue ---------------- */
function rebuildQueue4() {
    const nextQueue4 = [];

    for (const symbol of MASTER_SYMBOLS) {
        const entry = queue3State.get(symbol);
        if (!isFresh(entry)) continue;
        nextQueue4.push({ ...entry });
    }

    if (!queuesEqual(queue4, nextQueue4)) {
        queue4 = nextQueue4;
        displayQueue = nextQueue4;
        normalizeHead();
        return true;
    }

    return false;
}

/* ---------------- segmentation ----------------
   Build row1 and row2 so split always happens BETWEEN stocks
*/
function buildSegments() {
    const leftItems = [];
    const rightItems = [];

    if (displayQueue.length === 0) {
        return { leftItems, rightItems };
    }

    normalizeHead();

    let idx = currentHead;
    let leftUsed = 0;

    while (leftItems.length < displayQueue.length) {
        const item = displayQueue[idx % displayQueue.length];
        const w = measureStockWidth(item);

        if (leftItems.length > 0 && leftUsed + w > LEFT_SCREEN_WIDTH) break;

        leftItems.push(item);
        leftUsed += w;
        idx++;
    }

    let rightUsed = 0;

    while ((rightItems.length + leftItems.length) < displayQueue.length) {
        const item = displayQueue[idx % displayQueue.length];
        const w = measureStockWidth(item);

        if (rightItems.length > 0 && rightUsed + w > RIGHT_SCREEN_WIDTH) break;

        rightItems.push(item);
        rightUsed += w;
        idx++;
    }

    return { leftItems, rightItems };
}

/* ---------------- rendering ---------------- */
function renderRows() {
    if (isRendering) return;
    isRendering = true;

    if (displayQueue.length === 0) {
        ticker1.innerHTML = "";
        ticker2.innerHTML = "";
        isRendering = false;
        return;
    }

    const { leftItems, rightItems } = buildSegments();

    ticker1.innerHTML = leftItems.map(makeStockHTML).join("");
    ticker2.innerHTML = rightItems.map(makeStockHTML).join("");

    isRendering = false;
}

/* ---------------- step ticker ----------------
   Advance one full stock at a time.
   This guarantees no stock is cut at the split.
*/
function stepTicker() {
    if (displayQueue.length === 0) return;

    currentHead = (currentHead + 1) % displayQueue.length;
    renderRows();
}

/* ---------------- schedulers ---------------- */
setInterval(() => {
    const changed1 = applyPendingUpdatesToQueue3();
    const changed2 = rebuildQueue4();

    if (changed1 || changed2) {
        renderRows();
    }
}, APPLY_UPDATES_MS);

setInterval(() => {
    const changed = rebuildQueue4();
    if (changed) {
        renderRows();
    }
}, BUILD_QUEUE4_MS);

setInterval(() => {
    stepTicker();
}, STEP_INTERVAL_MS);

*/

/* ---------------- start ---------------- */
renderRows();
</script>

</body>
</html>
