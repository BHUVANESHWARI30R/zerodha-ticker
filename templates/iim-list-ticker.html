<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
}

.list1-row { width: 2176px; height: 128px; }
.list2-row { width: 2048px; height: 128px; }

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0,0,0);
}

.ticker {
    display: flex;
    white-space: nowrap;
}

.stock {
    display: flex;
    align-items: center;
    margin-right: 80px;
    min-width: 260px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
}

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>

<div class="ticker-row list1-row">
    <div class="ticker-wrapper" id="wrapper1">
        <div class="ticker" id="ticker1"></div>
    </div>
</div>

<div class="ticker-row list2-row">
    <div class="ticker-wrapper" id="wrapper2">
        <div class="ticker" id="ticker2"></div>
    </div>
</div>

<script>
const socket = io();

const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const ticker1 = document.getElementById("ticker1");
const ticker2 = document.getElementById("ticker2");

const LEFT_SCREEN_WIDTH = 2176;
const SPEED = 0.012;

/* 🔥 FIXED GLOBAL TIME */
let START_TIME = localStorage.getItem("ticker_start_time");
if (!START_TIME) {
    START_TIME = Date.now();
    localStorage.setItem("ticker_start_time", START_TIME);
} else {
    START_TIME = parseInt(START_TIME);
}

/* ---------------- DATA ---------------- */
let displayQueue = [];
const pendingUpdates = {};
const queueMap = new Map();

/* ---------------- SOCKET ---------------- */
socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- CREATE STOCK ---------------- */
function createStockNode(data) {
    const div = document.createElement("div");
    div.className = "stock";
    div.dataset.symbol = data.symbol;

    div.innerHTML = `
        <div>
            <div class="symbol-ltp ${data.change < 0 ? "down" : "up"}">${data.symbol}</div>
            <div class="symbol-ltp">${data.ltp}</div>
        </div>
        <div class="change-arrow ${data.change < 0 ? "down" : "up"}">
            (${data.change_percent}%)
        </div>
    `;
    return div;
}

/* ---------------- INITIAL RENDER ---------------- */
function initialRender(queue) {
    ticker1.innerHTML = "";
    ticker2.innerHTML = "";

    queue.forEach(item => {
        const node1 = createStockNode(item);
        const node2 = createStockNode(item);

        ticker1.appendChild(node1);
        ticker2.appendChild(node2);
    });

    /* duplicate for loop */
    ticker1.innerHTML += ticker1.innerHTML;
    ticker2.innerHTML += ticker2.innerHTML;
}

/* ---------------- PATCH ONLY VALUES ---------------- */
function patchTicker(dataList) {
    dataList.forEach(data => {
        const nodes = document.querySelectorAll(`[data-symbol="${data.symbol}"]`);

        nodes.forEach(node => {
            const ltp = node.children[0].children[1];
            const arrow = node.children[1];

            if (ltp) ltp.textContent = data.ltp;
            if (arrow) arrow.textContent = `(${data.change_percent}%)`;
        });
    });
}

/* ---------------- UPDATE LOOP ---------------- */
setInterval(() => {
    const keys = Object.keys(pendingUpdates);
    if (!keys.length) return;

    keys.forEach(symbol => {
        queueMap.set(symbol, pendingUpdates[symbol]);
        delete pendingUpdates[symbol];
    });

    const updated = Array.from(queueMap.values());
    updated.sort((a, b) => a.symbol.localeCompare(b.symbol));

    if (displayQueue.length === 0) {
        displayQueue = updated;
        initialRender(displayQueue);
    } else {
        patchTicker(updated); // 🔥 no rebuild
    }

}, 300);

/* ---------------- SMOOTH SCROLL ---------------- */
function animate() {
    requestAnimationFrame(animate);

    const now = Date.now() - START_TIME;
    const x = now * SPEED;

    wrapper1.style.transform = `translate3d(${-x}px,0,0)`;
    wrapper2.style.transform = `translate3d(${-(x + LEFT_SCREEN_WIDTH)}px,0,0)`;
}

animate();
</script>

</body>
</html>
