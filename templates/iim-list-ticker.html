<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

body {
    line-height: 1;
}

.page {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    position: relative;
    margin: 0;
    padding: 0;
}

.list1-row {
    width: 2176px;   /* LEFT SCREEN */
    height: 128px;
}

.list2-row {
    width: 2048px;   /* RIGHT SCREEN */
    height: 128px;
    border-top: none;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    margin: 0;
    padding: 0;
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    width: max-content;
    flex-shrink: 0;
    margin: 0;
    padding: 0;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
    flex-shrink: 0;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
    white-space: nowrap;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;
}

.arrow {
    margin-right: 2px;
}

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>

<div class="page">
    <div class="ticker-row list1-row" id="row1">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
            <div class="ticker" id="ticker1-clone"></div>
        </div>
    </div>

    <div class="ticker-row list2-row" id="row2">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
            <div class="ticker" id="ticker2-clone"></div>
        </div>
    </div>
</div>

<script>
console.log("SET4 LOCKED TICKER LOADED");

const socket = io();

const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const ticker1 = document.getElementById("ticker1");
const ticker1Clone = document.getElementById("ticker1-clone");

const ticker2 = document.getElementById("ticker2");
const ticker2Clone = document.getElementById("ticker2-clone");

const row1 = document.getElementById("row1");
const row2 = document.getElementById("row2");

const params = new URLSearchParams(window.location.search);
const screenMode = params.get("screen") || "both";

if (screenMode === "1") {
    row2.style.visibility = "hidden";
    row2.style.position = "absolute";
}

if (screenMode === "2") {
    row1.style.visibility = "hidden";
    row1.style.position = "absolute";
}

/* ---------------- CONSTANTS ---------------- */
const LEFT_SCREEN_WIDTH = 2176;
const SPEED = 0.03;
const START_TIME = 1700000000000;
const UPDATE_INTERVAL_MS = 300;

/* ---------------- MODEL ----------------
   set4Map     = realtime latest data, no duplicates
   queue3Batch = frozen batch prepared after loop
   queue2Batch = right-side feeder concept
   queue1Batch = left-side visible concept
   displayQueue = currently rendered ticker ribbon

   Realtime updates touch ONLY set4Map.
   Ticker updates ONLY after full loop.
*/
const set4Map = new Map();

let queue1Batch = [];
let queue2Batch = [];
let queue3Batch = [];
let displayQueue = [];

const pendingUpdates = {};

let cycleWidth = 0;
let lastX = 0;
let firstRenderDone = false;

/* ---------------- SOCKET ---------------- */
socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

socket.on("connect_error", (err) => {
    console.error("❌ connect_error:", err);
});

socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- UI ---------------- */
function formatSignedNumber(value) {
    return value >= 0 ? `+${value}` : `${value}`;
}

function makeStockHTML(data) {
    const colorClass = data.change < 0 ? "down" : "up";
    const arrow = data.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock" data-symbol="${data.symbol}">
            <div class="stock-text">
                <div>
                    <div class="symbol-ltp ${colorClass}">${data.symbol}</div>
                    <div class="symbol-ltp ${colorClass}">${data.ltp}</div>
                </div>

                <div class="change-arrow ${colorClass}" style="flex-direction: column; align-items: flex-end;">
                    <div>(${data.change_percent}%)</div>
                    <div>
                        <span class="arrow">${arrow}</span>
                        <span>${formatSignedNumber(data.change)}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
}

/* ---------------- SET 4 ---------------- */
function updateSet4Only() {
    const symbols = Object.keys(pendingUpdates);
    if (!symbols.length) return;

    const now = Date.now();

    for (const symbol of symbols) {
        set4Map.set(symbol, {
            ...pendingUpdates[symbol],
            ts: now
        });

        delete pendingUpdates[symbol];
    }
}

function buildSortedSet4Batch() {
    return Array.from(set4Map.values())
        .sort((a, b) => a.symbol.localeCompare(b.symbol))
        .map(item => ({ ...item }));
}

/* ---------------- RENDER ---------------- */
function clearTicker() {
    ticker1.innerHTML = "";
    ticker1Clone.innerHTML = "";
    ticker2.innerHTML = "";
    ticker2Clone.innerHTML = "";
    cycleWidth = 0;
}

function renderTickerFrom(queue) {
    if (!queue.length) {
        clearTicker();
        return;
    }

    const html = queue.map(makeStockHTML).join("");

    ticker1.innerHTML = html;
    ticker1Clone.innerHTML = html;

    ticker2.innerHTML = html;
    ticker2Clone.innerHTML = html;

    cycleWidth = ticker1.scrollWidth || ticker2.scrollWidth;
}

/* ---------------- APPLY NEW BATCH ONLY AFTER LOOP ---------------- */
function loadNextBatchFromSet4() {
    const batch = buildSortedSet4Batch();
    if (!batch.length) return;

    queue3Batch = batch.map(item => ({ ...item }));
    queue2Batch = queue3Batch.map(item => ({ ...item }));
    queue1Batch = queue2Batch.map(item => ({ ...item }));

    displayQueue = queue1Batch.map(item => ({ ...item }));
    renderTickerFrom(displayQueue);
}

/* ---------------- ANIMATION ---------------- */
function animate() {
    requestAnimationFrame(animate);

    if (!cycleWidth) return;

    const now = Date.now() - START_TIME;
    const x = (now * SPEED) % cycleWidth;

    /*
      Full loop completed.
      Only now we copy Set 4 into Queue 3 → Queue 2 → Queue 1.
      No realtime update touches the running ticker mid-flow.
    */
    if (x < lastX) {
        loadNextBatchFromSet4();
    }

    lastX = x;

    const leftOffset = x;
    const rightOffset = x + LEFT_SCREEN_WIDTH;

    if (screenMode !== "2") {
        wrapper1.style.transform = `translate3d(${-leftOffset}px,0,0)`;
    }

    if (screenMode !== "1") {
        wrapper2.style.transform = `translate3d(${-rightOffset}px,0,0)`;
    }
}

/* ---------------- UPDATE LOOP ---------------- */
setInterval(() => {
    updateSet4Only();

    /*
      First render only.
      After first render, visible queues are frozen until loop completes.
    */
    if (!firstRenderDone && set4Map.size > 0) {
        loadNextBatchFromSet4();
        firstRenderDone = true;
    }
}, UPDATE_INTERVAL_MS);

/* ---------------- START ---------------- */
animate();
</script>

</body>
