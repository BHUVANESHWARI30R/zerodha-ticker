<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.page {
    width: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    gap: 0;
}

.ticker-row {
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
}

.list1-row {
    width: 2176px;
    height: 120px;
}

.list2-row {
    width: 2048px;
    height: 120px;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    will-change: transform;
    transform: translate3d(0,0,0);
    backface-visibility: hidden;
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
}

.stock-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 28px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
}

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>

<div class="page">

    <!-- LEFT SCREEN -->
    <div class="ticker-row list1-row">
        <div class="ticker-wrapper" id="wrapper1">
            <div class="ticker" id="ticker1"></div>
            <div class="ticker" id="ticker1-clone"></div>
        </div>
    </div>

    <!-- RIGHT SCREEN -->
    <div class="ticker-row list2-row">
        <div class="ticker-wrapper" id="wrapper2">
            <div class="ticker" id="ticker2"></div>
            <div class="ticker" id="ticker2-clone"></div>
        </div>
    </div>

</div>

<script>
const socket = io();

const wrapper1 = document.getElementById("wrapper1");
const wrapper2 = document.getElementById("wrapper2");

const ticker1 = document.getElementById("ticker1");
const ticker1Clone = document.getElementById("ticker1-clone");

const ticker2 = document.getElementById("ticker2");
const ticker2Clone = document.getElementById("ticker2-clone");

const LEFT_SCREEN_WIDTH = 2176;

let displayQueue = [];
let pendingUpdates = {};

let globalX = 0;
let cycleWidth = 0;

const SPEED = 2.2;

/* ---------------- socket ---------------- */
socket.on("connect", () => {
    console.log("✅ Connected");
});

socket.on("stock_update", (data) => {
    pendingUpdates[data.symbol] = data;
});

/* ---------------- helpers ---------------- */
function formatSignedNumber(value) {
    return value >= 0 ? `+${value}` : value;
}

function makeStockHTML(data) {
    const colorClass = data.change < 0 ? "down" : "up";
    const arrow = data.change >= 0 ? "▲" : "▼";

    return `
        <div class="stock">
            <div class="stock-text">
                <div class="symbol-ltp ${colorClass}">
                    ${data.symbol} ${data.ltp}
                </div>

                <div class="change-arrow ${colorClass}">
                    ${arrow} ${formatSignedNumber(data.change)}
                </div>
            </div>
        </div>
    `;
}

/* ---------------- render ---------------- */
function renderSharedStream() {
    if (displayQueue.length === 0) return;

    const html = displayQueue.map(makeStockHTML).join("");

    ticker1.innerHTML = html;
    ticker1Clone.innerHTML = html;

    ticker2.innerHTML = html;
    ticker2Clone.innerHTML = html;

    cycleWidth = ticker1.scrollWidth;
}

/* ---------------- smooth animation ---------------- */
let lastTime = performance.now();

function animate(now) {
    requestAnimationFrame(animate);

    if (!cycleWidth) return;

    const delta = now - lastTime;
    lastTime = now;

    globalX += SPEED * (delta / 16.67);

    if (globalX >= cycleWidth) {
        globalX -= cycleWidth;
    }

    const offsetLeft = globalX % cycleWidth;
    const offsetRight = (globalX + LEFT_SCREEN_WIDTH) % cycleWidth;

    wrapper1.style.transform = `translate3d(${-offsetLeft}px,0,0)`;
    wrapper2.style.transform = `translate3d(${-offsetRight}px,0,0)`;
}

/* ---------------- update queue ---------------- */
setInterval(() => {
    const symbols = Object.keys(pendingUpdates);
    if (!symbols.length) return;

    for (const symbol of symbols) {
        const existing = displayQueue.find(x => x.symbol === symbol);

        if (existing) {
            Object.assign(existing, pendingUpdates[symbol]);
        } else {
            displayQueue.push(pendingUpdates[symbol]);
        }

        delete pendingUpdates[symbol];
    }

    renderSharedStream();
}, 300);

animate();
</script>

</body>
</html>
