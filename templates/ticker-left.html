<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker - LEFT</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.ticker-container {
    width: 2176px;
    height: 120px;
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    padding-top: 2px;
}

.ticker-wrapper {
    width: max-content;
    display: flex;
    will-change: transform;
    transform: translate3d(0,0,0);
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
}

.stock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-right: 80px;
    min-width: 260px;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
    line-height: 1.10;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
    line-height: 1.10;
}

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>

<div class="ticker-container">
    <div class="ticker-wrapper">
        <div class="ticker" id="ticker"></div>
        <div class="ticker" id="ticker-clone"></div>
    </div>
</div>

<script>
const socket = io();

const ticker = document.getElementById("ticker");
const tickerClone = document.getElementById("ticker-clone");
const wrapper = document.querySelector(".ticker-wrapper");

const elements = {};
const pendingUpdates = {};

// =====================
// 🔥 SYNC CLOCK (FIXED)
// =====================
let serverTime = 0;
let clientSyncTime = performance.now();

socket.on("ticker_sync", (data) => {
    serverTime = data.offset;   // server time in seconds
    clientSyncTime = performance.now();
});

function getSyncedTime() {
    return serverTime + (performance.now() - clientSyncTime) / 1000;
}

// =====================
// SOCKET CONNECT
// =====================
socket.on("connect", () => {
    console.log("✅ LEFT connected");
});

// =====================
// STOCK UPDATE BUFFER
// =====================
socket.on("stock_update", data => {
    pendingUpdates[data.symbol] = data;
});

setInterval(() => {
    for (const symbol in pendingUpdates) {
        const d = pendingUpdates[symbol];
        addOrUpdateStock(symbol, d.ltp, d.change, d.change_percent);
    }
    Object.keys(pendingUpdates).forEach(k => delete pendingUpdates[k]);
}, 500);

// =====================
// CREATE / UPDATE STOCK
// =====================
function addOrUpdateStock(symbol, ltp, change, changePercent) {

    const colorClass = change < 0 ? 'down' : 'up';

    if (!elements[symbol]) {

        const el = document.createElement("div");
        el.className = "stock";
        el.dataset.symbol = symbol;

        el.innerHTML = `
            <div>
                <div class="symbol-ltp ${colorClass}">${symbol}</div>
                <div class="symbol-ltp ${colorClass}">${ltp}</div>
            </div>

            <div class="change-arrow ${colorClass}" style="flex-direction: column; align-items: flex-end;">
                <div>(${changePercent}%)</div>
                <div>
                    <span>${change >= 0 ? '▲' : '▼'}</span>
                    <span>${change >= 0 ? '+' + change : change}</span>
                </div>
            </div>
        `;

        ticker.appendChild(el);
        elements[symbol] = el;

    } else {

        const el = elements[symbol];

        const priceBlock = el.querySelectorAll(".symbol-ltp")[1];
        const changeArrow = el.querySelector(".change-arrow");

        priceBlock.textContent = ltp;
        changeArrow.children[0].textContent = `(${changePercent}%)`;

        const row = changeArrow.children[1];
        row.children[0].textContent = change >= 0 ? '▲' : '▼';
        row.children[1].textContent = change >= 0 ? '+' + change : change;

        el.querySelectorAll(".symbol-ltp")[0].className = `symbol-ltp ${colorClass}`;
        priceBlock.className = `symbol-ltp ${colorClass}`;
        changeArrow.className = `change-arrow ${colorClass}`;
    }
}

// =====================
// SORT + CLONE
// =====================
setInterval(() => {

    const items = Array.from(ticker.children);

    items.sort((a, b) =>
        a.dataset.symbol.localeCompare(b.dataset.symbol)
    );

    ticker.innerHTML = "";
    items.forEach(i => ticker.appendChild(i));

    tickerClone.innerHTML = "";
    items.forEach(i => tickerClone.appendChild(i.cloneNode(true)));

}, 5000);

// =====================
// 🔥 PERFECT SYNC ANIMATION
// =====================
const SPEED = 160;

function animate() {

    const totalWidth = ticker.scrollWidth;
    if (!totalWidth) {
        requestAnimationFrame(animate);
        return;
    }

    const t = getSyncedTime();
    const x = -(t * SPEED % totalWidth);

    wrapper.style.transform = `translate3d(${x}px,0,0)`;

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
