<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Stock Ticker</title>

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&family=Orbitron:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      overflow: hidden;
      font-family: "Roboto Mono", "Orbitron", monospace;
      height: 80px;
      width: 100%;
    }

    .ticker-wrapper {
      width: 100%;
      overflow: hidden;
      background: #000;
      border-bottom: 2px solid #333;
    }

    .ticker {
      display: inline-flex;
      white-space: nowrap;
      animation: scroll 40s linear infinite;
    }

    .ticker-dup {
      display: inline-flex;
    }

    .stock {
      display: inline-flex;
      align-items: center;
      min-width: 320px;
      margin: 0 50px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .stock img {
      width: 38px;
      height: 38px;
      margin-right: 12px;
      object-fit: contain;
      filter: brightness(1.3);
    }

    .row {
      display: flex;
      justify-content: space-between;
      line-height: 1.4em;
    }

    .green { color: #00ff00; }
    .red { color: #ff3333; }

    @keyframes scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>

<body>
  <div class="ticker-wrapper">
    <div class="ticker">
      <div class="ticker-dup" id="ticker-content"></div>
      <div class="ticker-dup" id="ticker-clone"></div>
    </div>
  </div>

  <script>
  const socket = io();
  const ticker = document.getElementById("ticker");
  const content = document.getElementById("ticker-content");
  const clone = document.getElementById("ticker-clone");

  const stocks = {};
  let cloned = false;

  socket.on("stock_update", data => {
    const id = "stock-" + data.Symbol;

    let stock = stocks[id];

    if (!stock) {
      // CREATE ONCE
      stock = document.createElement("div");
      stock.className = "stock";
      stock.id = id;

      stock.innerHTML = `
        <img src="/static/logos/${data.Symbol}.png">
        <div>
          <div class="row">
            <span class="symbol"></span>
            <span class="price"></span>
          </div>
          <div class="row">
            <span class="change"></span>
            <span class="diff"></span>
          </div>
        </div>
      `;

      content.appendChild(stock);
      stocks[id] = stock;

      // clone ONLY ONCE after initial load
      setTimeout(() => {
        if (!cloned && content.children.length >= 10) {
          clone.innerHTML = content.innerHTML;
          cloned = true;
        }
      }, 1000);
    }

    // UPDATE TEXT ONLY (NO DOM RESET)
    const open = data.Open || data.Close;
    const change = data.Close - open;
    const pct = ((change / open) * 100).toFixed(2);
    const up = change >= 0;

    stock.querySelector(".symbol").textContent = data.Symbol;
    stock.querySelector(".price").textContent = data.Close.toFixed(2) + " ₹";

    const arrow = up ? "▲" : "▼";
    const cls = up ? "green" : "red";

    const changeEl = stock.querySelector(".change");
    const diffEl = stock.querySelector(".diff");

    changeEl.textContent = `${arrow} ${pct}%`;
    diffEl.textContent = `${arrow} ${change.toFixed(2)}`;

    changeEl.className = "change " + cls;
    diffEl.className = "diff " + cls;
  });
</script>

</body>
</html>
