<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.1/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.ticker-container {
    width: 100%;
    height: 100px;
    overflow: hidden;
   
    display: flex;
    align-items: center;
    background: #000;
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
    animation: scroll-left 150s linear infinite; /* slow smooth scroll */
}
.ticker-wrapper {
    display: flex;
    width: max-content;
    animation: scroll 80s linear infinite;
}

@keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}


.stock {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-right: 60px;
    min-width: 160px;
    font-size: 28px;
}

.stock img {
    width: auto;
    height: 40px;
    margin-right: 3px;
}

.stock-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.2;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 28px;
}

.change-arrow {
    font-size: 28px;
    font-weight: bold;
    display: flex;
    align-items: center;
}

.arrow {
    margin-right: 2px;
    font-weight: bold;
    font-size: 28px;
}

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>
<div class="ticker-container">
    <div class="ticker-wrapper" id="ticker-wrapper">
    <div class="ticker" id="ticker"></div>
    <div class="ticker" id="ticker-clone"></div> </div><!-- Duplicate for smooth loop -->
</div>

<script>
const socket = io();
const ticker = document.getElementById("ticker");
const tickerClone = document.getElementById("ticker-clone");
const stocks = {};      // store latest LTP
const elements = {};    // store DOM elements

// Function to create/update a stock item
function addOrUpdateStock(symbol, ltp, change, changePercent) {

    stocks[symbol] = ltp;

    const colorClass = change < 0 ? 'down' : 'up';

    if (!elements[symbol]) {
        const el = document.createElement("div");
        el.className = "stock";
        el.id = symbol;

        el.innerHTML = `
           
        <div class="stock-text">
        <div class="symbol-ltp ${colorClass}" id="${symbol}-symbol-ltp">
        ${symbol} ${ltp}
        </div>

        <div class="change-arrow ${colorClass}">
        <span class="arrow" id="${symbol}-arrow">
            ${change >= 0 ? '▲' : '▼'}
        </span>

        <span class="change" id="${symbol}-change">
            ${change >= 0 ? '+' + change : change}
            (${changePercent}%)
        </span>
        </div>
        </div>
        `;
        ticker.appendChild(el);
        tickerClone.appendChild(el.cloneNode(true)); // duplicate for infinite loop
        elements[symbol] = el;
        sortStocksAlphabetically();

    }
    else {
    const symbolEl = document.getElementById(`${symbol}-symbol-ltp`);
    const arrowEl = document.getElementById(`${symbol}-arrow`);
    const changeEl = document.getElementById(`${symbol}-change`);
    const changeArrowDiv = arrowEl.parentNode;

    symbolEl.innerText = `${symbol} ${ltp}`;

    arrowEl.innerText = change >= 0 ? '▲' : '▼';
    changeEl.innerText = `${change >= 0 ? '+' + change : change} (${changePercent}%)`;

    symbolEl.className = `symbol-ltp ${colorClass}`;
    changeArrowDiv.className = `change-arrow ${colorClass}`;
}
}
// Batch updates every 1 second for smoothness

function sortStocksAlphabetically() {
    const items = Array.from(ticker.children);

    items.sort((a, b) => a.id.localeCompare(b.id));

    items.forEach(item => ticker.appendChild(item));

    // Also sort clone for smooth loop
    tickerClone.innerHTML = "";
    items.forEach(item => tickerClone.appendChild(item.cloneNode(true)));
}
const pendingUpdates = {};
setInterval(() => {
    for (const symbol in pendingUpdates) {
        const d = pendingUpdates[symbol];
        addOrUpdateStock(symbol, d.ltp, d.change, d.change_percent);
    }
    Object.keys(pendingUpdates).forEach(k => delete pendingUpdates[k]);
}, 1000);

// Listen to WebSocket and queue updates
socket.on("stock_update", data => {
    
    pendingUpdates[data.symbol] = data;
});
</script>
</body>
</html>
