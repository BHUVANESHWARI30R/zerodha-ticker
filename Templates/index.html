<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Ticker</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      overflow: hidden;
      font-family: "Roboto Mono", "Orbitron", monospace;
      font-size: 30px;
      font-weight: bolder;
      height: 80px;
      width: 100%;
    }

    .ticker-wrapper {
      width: 100%;
      overflow: hidden;
      background: #000;
      border-bottom: 2px solid #333;
    }

    /* scrolling area */
    .ticker {
      display: inline-flex;
      white-space: nowrap;
      animation: scroll 40s linear infinite;
    }

    /* duplicate ticker for seamless loop */
    .ticker-dup {
      display: inline-flex;
    }
    .stock {
        display: inline-block;
        min-width: 240px;      /* auto handles long vs short symbols */
        margin: 0 50px;        /* adjustable spacing between stocks */
        text-align: left;
        font-size: 28px;       /* larger font for readability */
        font-weight: 900;
        letter-spacing: 1px;
    }
    .stock .row {
        display: flex;
        justify-content: space-evenly; /* keeps values aligned neatly */
        line-height: 1.6em;
    }

    .green { color: #00ff00; font-weight: 700; }
    .red { color: #ff3333; font-weight: 700; }

    @keyframes scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); } /* half = because we duplicate */
    }
    .stock {
  display: inline-flex;
  align-items: center;
  min-width: 320px;
  margin: 0 50px;
}

.stock img {
  width: 38px;
  height: 38px;
  margin-right: 12px;
  object-fit: contain;
}

  </style>
  <script>
const logoDomains = {
  "RELIANCE": "relianceindustries.com",
  "TCS": "tcs.com",
  "INFY": "infosys.com",
  "HDFCBANK": "hdfcbank.com",
  "ICICIBANK": "icicibank.com",
  "SBIN": "sbi.co.in",
  "KOTAKBANK": "kotak.com",
  "LT": "larsentoubro.com",
  "HCLTECH": "hcltech.com",
  "AXISBANK": "axisbank.com",
  "MARUTI": "marutisuzuki.com",
  "BAJAJ-AUTO": "bajajauto.com",
  "WIPRO": "wipro.com",
  "ITC": "itcportal.com",
  "ONGC": "ongcindia.com",
  "NTPC": "ntpc.co.in",
  "POWERGRID": "powergridindia.com",
  "TITAN": "titan.co.in",
  "ULTRACEMCO": "ultratechcement.com",
  "ASIANPAINT": "asianpaints.com",
  "HINDUNILVR": "hul.co.in",
  "SUNPHARMA": "sunpharma.com",
  "DRREDDY": "drreddys.com",
  "JSWSTEEL": "jsw.in",
  "TATAMOTORS": "tatamotors.com",
  "ADANIENT": "adani.com",
  "ADANIPORTS": "adaniports.com",
  "COALINDIA": "coalindia.in",
  "BPCL": "bharatpetroleum.in",
  "GRASIM": "grasim.com"
};


</script>

</head>
<body>
  <div class="ticker-wrapper">
    <div class="ticker" id="ticker">
      <div class="ticker-dup" id="ticker-content"></div>
      <div class="ticker-dup" id="ticker-clone"></div>
    </div>
  </div>

  <script>
    const socket = io();
    const tickerContent = document.getElementById("ticker-content");
    const tickerClone = document.getElementById("ticker-clone");
    const stocks = {};

    socket.on("stock_update", data => {
      let symbolId = "stock-" + data.Symbol;
      let stockDiv = document.getElementById(symbolId);

      let change = data.Close - data.Open;
      let changePct = (change / data.Open * 100).toFixed(2);
      let isGreen = change >= 0;

      let arrow = isGreen ? "▲" : "▼";
      let colorClass = isGreen ? "green" : "red";

      if (!stockDiv) {
        stockDiv = document.createElement("div");
        stockDiv.className = "stock";
        stockDiv.id = symbolId;
        tickerContent.appendChild(stockDiv);
      }

     let domain = logoDomains[data.Symbol];
let logoUrl = domain ? `https://logo.clearbit.com/${domain}` : "";

stockDiv.innerHTML = `
  ${logoUrl ? `<img src="${logoUrl}" onerror="this.style.display='none'">` : ""}
  <div>
    <div class="row">
      <span>${data.Symbol}</span>
      <span class="${colorClass}">${data.Close.toFixed(2)} ₹</span>
    </div>
    <div class="row">
      <span class="${colorClass}">${arrow} ${changePct}%</span>
      <span class="${colorClass}">${arrow} ${change.toFixed(2)}</span>
    </div>
  </div>
`;


      // keep clone in sync for infinite loop
      tickerClone.innerHTML = tickerContent.innerHTML;
    });
  </script>
</body>
</html>
