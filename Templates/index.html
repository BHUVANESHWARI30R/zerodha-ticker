<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DigiWave Stock Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">

<!-- ✅ Socket.IO v4 (compatible with Flask-SocketIO 5+) -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: 'Teko', sans-serif;
    overflow: hidden;
}

.ticker-container {
    width: 100%;
    height: 90px;
    overflow: hidden;
    display: flex;
    align-items: center;
    background: #000;
    padding: top -5px;
}

.ticker-wrapper {
    display: flex;
    width: max-content;
    animation: scroll 110s linear infinite;
}

@keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

.ticker {
    display: flex;
    align-items: center;
    white-space: nowrap;
}

.stock {
    display: flex;
    align-items: center;
    margin-right: 60px;
    min-width: 160px;
    font-size: 55px;
}

.stock-text {
    display: flex;
    flex-direction: column;
    line-height: 0.8;
}

.symbol-ltp {
    font-weight: bold;
    font-size: 55px;
}

.change-arrow {
    font-size: 55px;
    font-weight: bold;
    display: flex;
    align-items: center;
}

.arrow {
    margin-right: 2px;
}

.up { color: lime; }
.down { color: red; }
</style>
</head>

<body>

<div class="ticker-container">
    <div class="ticker-wrapper">
        <div class="ticker" id="ticker"></div>
        <div class="ticker" id="ticker-clone"></div>
    </div>
</div>

<script>
const socket = io();
const ticker = document.getElementById("ticker");
const tickerClone = document.getElementById("ticker-clone");

const elements = {};
const pendingUpdates = {};

// ✅ Connection Debug
socket.on("connect", () => {
    console.log("✅ Connected to backend");
});

// ---------------- Create or Update Stock ----------------
function addOrUpdateStock(symbol, ltp, change, changePercent) {

    const colorClass = change < 0 ? 'down' : 'up';

    if (!elements[symbol]) {

        const el = document.createElement("div");
        el.className = "stock";
        el.dataset.symbol = symbol;

        el.innerHTML = `
            <div class="stock-text">
                <div class="symbol-ltp ${colorClass}">
                    ${symbol}  ${ltp}
                </div>
                <div class="change-arrow ${colorClass}">
                    <span class="arrow">
                        ${change >= 0 ? '▲' : '▼'}
                    </span>
                    <span>
                        ${change >= 0 ? '+' + change : change}  (${changePercent}%)
                    </span>
                </div>
            </div>
        `;

        ticker.appendChild(el);
        elements[symbol] = el;

        sortStocks();

    } else {

        const el = elements[symbol];
        const symbolLtp = el.querySelector(".symbol-ltp");
        const changeArrow = el.querySelector(".change-arrow");
        const arrow = el.querySelector(".arrow");
        const changeSpan = changeArrow.querySelector("span:last-child");

        symbolLtp.textContent = `${symbol} ${ltp}`;
        arrow.textContent = change >= 0 ? '▲' : '▼';
        changeSpan.textContent = `${change >= 0 ? '+' + change : change} (${changePercent}%)`;

        symbolLtp.className = `symbol-ltp ${colorClass}`;
        changeArrow.className = `change-arrow ${colorClass}`;
    }
}

// ---------------- Sorting + Clone Rebuild ----------------
function sortStocks() {

    const items = Array.from(ticker.children);

    items.sort((a, b) => 
        a.dataset.symbol.localeCompare(b.dataset.symbol)
    );

    ticker.innerHTML = "";
    items.forEach(item => ticker.appendChild(item));

    // ✅ Rebuild clone WITHOUT duplicate IDs
    tickerClone.innerHTML = "";

    items.forEach(item => {
        const clone = item.cloneNode(true);
        tickerClone.appendChild(clone);
    });
}

// ---------------- Batch Updates (Smooth UI) ----------------
setInterval(() => {
    for (const symbol in pendingUpdates) {
        const d = pendingUpdates[symbol];
        addOrUpdateStock(symbol, d.ltp, d.change, d.change_percent);
    }
    Object.keys(pendingUpdates).forEach(k => delete pendingUpdates[k]);
}, 1000);

// ---------------- Listen to Backend ----------------
socket.on("stock_update", data => {
    console.log("📥 Received:", data);  // 👈 ADD THIS
    pendingUpdates[data.symbol] = data;
});
</script>

</body>
</html>
